    <div class="sec-head"><span class="lbl g">${t("characters")}</span><h2>${t("chars")} <em style="font-style:italic;color:var(--muted)">${t("charsSub")}</em></h2></div>
    <div class="chars">${ch.map(([cid,wid])=>{const w=W.find(x=>x.id.includes(wid))||W[0];const c=chap(cid);return `<a class="char" href="#collections"><div class="img"><img src="${img(w.id)}" alt="${esc(w.t)}" loading="lazy"></div><span class="lbl">${t("chapter")} ${c.num}</span><h3>${cid==="origins"?"DODGE HOODY":c.en}</h3><p>${esc(t("charText")[cid])}</p></a>`}).join("")}</div>
  </div></section>
  <section style="padding-top:0"><div class="wrap">
    <div class="sec-head row"><div style="display:flex;flex-direction:column;gap:18px"><span class="lbl g">${t("collections")}</span><h2>${t("featured")}</h2></div><a class="more" href="#collections">${t("all")}</a></div>
    <div class="cards">${feat.map(card).join("")}</div>
  </div></section>`;
}
function collections(){
  return `<section class="fade" style="padding-top:88px"><div class="wrap">
    <div class="sec-head"><span class="lbl g">${W.length} ${t("works")} · ${C.length} ${t("collections")}</span><h2 style="font-size:clamp(48px,7vw,104px)">${t("colTitle")}</h2><p class="lead">${t("colLead")}</p></div>
    ${CH.map(ch=>`<div class="chapter"><div class="ch-head"><div class="ch-num">${ch.num}</div><div><h2>${esc(lang==="th"?ch.th:ch.en)}</h2><p class="lead">${esc(lang==="th"?ch.bth:ch.ben)}</p></div></div>
      <div class="cards">${C.filter(c=>c.ch===ch.id).map(card).join("")}</div></div>`).join("")}
  </div></section>`;
}
function room(id){
  const c=coll(id); if(!c) return notFound();
  const ws=byColl[id]||[]; const i=C.indexOf(c); const p=C[i-1], n=C[i+1]; const ch=chap(c.ch);
  return `<div class="wrap fade"><div class="room-head">
    <div><div class="crumb lbl"><a href="#collections">${t("collections")}</a><span>/</span><span>${t("chapter")} ${ch.num} · ${esc(lang==="th"?ch.th:ch.en)}</span></div>
      <h1>${esc(cname(c))}</h1>${lang==="th"?`<p class="lbl" style="margin-top:14px">${esc(c.en)}</p>`:""}
      <p class="lead" style="margin-top:28px">${esc(cblurb(c))}</p><p class="count" style="margin-top:24px">${nCount(ws.length)}</p></div>
    ${c.p?`<div class="poster frame"><img src="${pic("c:"+c.p)}" alt="${esc(c.en)} poster"></div>`:""}
  </div>
  <div class="wall">${ws.map(w=>`<a class="piece" href="#w-${w.id}"><div class="img"><img src="${img(w.id)}" alt="${esc(w.t)}" loading="lazy" width="1000" height="${Math.round(1000/w.r)}"></div><div class="tag"><h3>${esc(w.t)}</h3><span class="no">${esc(w.n)}</span></div></a>`).join("")}</div>
  <div class="pager">${p?`<a href="#c-${p.id}"><span class="lbl">← ${t("prevC")}</span><b>${esc(cname(p))}</b></a>`:"<span></span>"}${n?`<a href="#c-${n.id}"><span class="lbl">${t("nextC")} →</span><b>${esc(cname(n))}</b></a>`:""}</div></div>`;
}
function work(id){
  const w=W.find(x=>x.id===id); if(!w) return notFound();
  const c=coll(w.c), ws=byColl[w.c], i=ws.indexOf(w), p=ws[(i-1+ws.length)%ws.length], n=ws[(i+1)%ws.length], ch=chap(c.ch);
  const main=lang==="th"?w.th:w.en, alt=lang==="th"?w.en:w.th;
  const charName=ch.id==="origins"||ch.id==="stories"?"DODGE HOODY":ch.id==="special"?"DODGE HOODY":ch.en;
  return `<div class="wrap fade"><div class="art">
    <div class="stage"><img src="${img(w.id)}" alt="${esc(w.t)}"></div>
    <div class="label">
      <div class="crumb lbl" style="margin:0"><a href="#collections">${t("collections")}</a><span>/</span><a href="#c-${c.id}">${esc(cname(c))}</a></div>
      <div style="display:flex;flex-direction:column;gap:16px"><span class="lbl g">${esc(w.n||"—")}</span><h1>${esc(w.t)}</h1><hr class="rule"></div>
      ${main?`<p class="mean ${lang}">${esc(main)}</p>`:""}
      ${alt?`<p class="mean-alt" lang="${lang==="th"?"en":"th"}">${esc(alt)}</p>`:""}
      <dl><dt>${t("coll")}</dt><dd><a href="#c-${c.id}">${esc(cname(c))}</a></dd><dt>${t("no")}</dt><dd>${esc(w.n||"—")}</dd><dt>${t("char")}</dt><dd>${esc(charName)}</dd><dt>${t("tech")}</dt><dd>${t("techv")}</dd></dl>
      ${c.ch!=="special"?`<div class="cert"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c6a35a" stroke-width="1.4" aria-hidden="true"><circle cx="12" cy="9" r="6"/><path d="M8.5 13.5 7 22l5-3 5 3-1.5-8.5"/></svg><span>${t("certText")}</span></div>`:""}
      ${ws.length>1?`<div class="nav-art"><a href="#w-${p.id}">← ${t("prev")}</a><a href="#w-${n.id}">${t("next")} →</a></div>`:""}
      <a class="more" href="#c-${c.id}">${t("back")}</a>
    </div></div></div>`;
}
function artist(){
  const sk=D.extras.sketch;
  return `<section class="fade" style="padding-top:88px"><div class="wrap bio">
    <div><div class="portrait frame"><img src="${pic("x:artist")}" alt="Metee Youngkongwiruchporn"></div></div>
    <div><span class="lbl g">${t("artistLbl")}</span><h1>Metee<br>Youngkongwiruchporn</h1><p class="lead">${esc(t("bio"))}</p>
      <div class="socials"><a class="social" href="https://www.facebook.com/Beagledoglove" target="_blank" rel="noopener"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 21v-7.5h2.5l.4-3h-2.9V8.6c0-.9.3-1.5 1.5-1.5h1.5V4.4c-.3 0-1.2-.1-2.2-.1-2.2 0-3.7 1.3-3.7 3.8v2.4H8v3h2.6V21h2.9Z"/></svg><span>${t("follow")}</span><span class="handle">facebook.com/Beagledoglove</span></a><a class="social" href="https://www.tiktok.com/@dodgehoody" target="_blank" rel="noopener"><svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.6 3c.3 2.2 1.6 3.7 3.9 3.9v3c-1.4.1-2.7-.3-3.9-1.1v6.1c0 3.7-3.6 6.2-7 5.1-3.4-1-4.6-5.3-2.3-8 1.2-1.4 3-2 4.8-1.8v3.1c-.6-.2-1.3-.2-1.9 0-1.6.6-1.9 2.8-.5 3.7 1.3.9 3.2.1 3.4-1.5V3h3.5Z"/></svg><span>${t("followTT")}</span><span class="handle">@dodgehoody</span></a></div>
      <ol class="journey">${t("journey").map(j=>`<li><span class="k">${j[0]}</span><div><h3>${esc(j[1])}</h3><p>${esc(j[2])}</p></div></li>`).join("")}</ol>
    </div></div></section>
  <section class="statement"><div class="wrap narrow"><blockquote>“${esc(t("statement"))}”</blockquote></div></section>
  <section><div class="wrap"><div class="sec-head"><span class="lbl g">${t("sketches")}</span><h2>${t("sketchSub")}</h2></div>
    <div class="sketches">${sk.map(s=>`<div class="frame"><img src="${pic("x:"+s.id)}" alt="Sketch" loading="lazy"></div>`).join("")}</div></div></section>`;
}
function exhibitions(){
  const x=D.extras.exhibit, cls=["a","b","c","d"], cap=t("exCap");
  return `<section class="fade" style="padding-top:88px"><div class="wrap">
    <div class="sec-head"><span class="lbl g">${t("exTitle")}</span><h2 style="font-size:clamp(48px,7vw,104px)">${t("exTitle")}</h2><p class="lead">${t("exLead")}</p></div>
    <div class="ex">${x.map((e,i)=>`<figure class="${cls[i]}"><div class="ph"><img src="${pic("x:"+e.id)}" alt="${esc(cap[i])}" loading="lazy"></div><figcaption class="lbl">${esc(cap[i])}</figcaption></figure>`).join("")}</div>
  </div></section>`;
}
function contact(){
  return `<section class="fade" style="padding-top:88px"><div class="wrap contact">
    <div><span class="lbl g">${t("ctTitle")}</span><h2 style="font-size:clamp(48px,7vw,104px);margin-block:18px 28px">${t("ctTitle")}</h2><p class="lead">${t("ctLead")}</p></div>
    <div class="channels"><div><b>Facebook</b><a class="more" href="https://www.facebook.com/Beagledoglove" target="_blank" rel="noopener">Beagledoglove</a></div><div><b>TikTok</b><a class="more" href="https://www.tiktok.com/@dodgehoody" target="_blank" rel="noopener">@dodgehoody</a></div>${["Instagram","Email"].map(n=>`<div><b>${n}</b><span class="lbl">${t("pending")}</span></div>`).join("")}</div>
  </div></section>`;
}
function notFound(){return `<section class="wrap"><h2>404</h2><p style="margin-top:24px"><a class="more" href="#home">DODGE HOODY</a></p></section>`}

let timer;
function render(){
  need.clear();
  const h=(location.hash||"#home").slice(1);
  document.documentElement.lang=lang;
  $("#l-th").setAttribute("aria-pressed",lang==="th");$("#l-en").setAttribute("aria-pressed",lang==="en");
  $("#menu-btn").textContent=lang==="th"?"เมนู":"Menu";
  const top=h.startsWith("c-")||h.startsWith("w-")?"collections":h;
  $("#menu").innerHTML=t("nav").map(([id,n])=>`<li><a href="#${id}" class="${id===top?"on":""}">${n}</a></li>`).join("");
  $("#foot-note").textContent=t("foot");
  let html;
  if(h.startsWith("c-")) html=room(h.slice(2));
  else if(h.startsWith("w-")) html=work(h.slice(2));
  else html=({home,collections,artist,exhibitions,contact}[h]||home)();
  $("#app").innerHTML=html;
  clearInterval(timer);
  const s=$("#slides");
  if(s && !matchMedia("(prefers-reduced-motion: reduce)").matches){
    let i=0;const im=[...s.querySelectorAll("img")];
    timer=setInterval(()=>{im[i].classList.remove("on");i=(i+1)%im.length;im[i].classList.add("on");$("#cap-t").textContent=im[i].dataset.t;$("#cap-n").textContent=im[i].dataset.n},5200);
  }
  const w=h.startsWith("w-")?W.find(x=>x.id===h.slice(2)):null;
  document.title=w?`${w.t} — DODGE HOODY`:"DODGE HOODY";
  const miss=[...need].filter(k=>k!==undefined&&!loaded.has(k));
  if(miss.length){const at=location.hash;Promise.all(miss.map(loadChunk)).then(()=>{if(location.hash===at){const y=scrollY;render();scrollTo(0,y)}})}
}
let lastRoute="";
window.addEventListener("hashchange",()=>{render();$("#nav").classList.remove("open");$("#menu-btn").setAttribute("aria-expanded","false");window.scrollTo({top:0,behavior:"instant"})});
document.querySelector(".lang").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;lang=b.dataset.l;try{localStorage.setItem("dh-lang",lang)}catch(e){}render()});
$("#menu-btn").addEventListener("click",()=>{const o=$("#nav").classList.toggle("open");$("#menu-btn").setAttribute("aria-expanded",o)});
document.addEventListener("keydown",e=>{const h=location.hash;if(!h.startsWith("#w-"))return;const a=[...document.querySelectorAll(".nav-art a")];if(e.key==="ArrowLeft"&&a[0])location.hash=a[0].getAttribute("href");if(e.key==="ArrowRight"&&a[1])location.hash=a[1].getAttribute("href")});
render();
})();
</script>
