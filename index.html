<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="DODGE HOODY">
<meta property="og:image" content="og.jpg">
<link rel="icon" href="icon.png">
<title>DODGE HOODY</title>
<meta name="description" content="DODGE HOODY — digital paintings by Metee Youngkongwiruchporn. ผลงานภาพวาดดิจิทัล DODGE HOODY">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&family=Noto+Serif+Thai:wght@300;400;500&family=Anuphan:wght@300;400&display=swap">
<style>
/* Layout: a night-time private gallery. Black rooms, ivory type, one thread of seal-gold. Pages: Home, Collections, Collection room, Artwork wall-label, Artist, Exhibitions, Contact. */
:root{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
  --bg:#0a0908; --room:#111010; --wall:#171515; --ivory:#efe8dc; --muted:#9a9187; --faint:#5e5851; --line:#26221f;
  --gold:#c6a35a; --gold-soft:rgba(198,163,90,.14);
  --display:"Cormorant Garamond","Noto Serif Thai",Georgia,serif;
  --thai-display:"Cormorant Garamond","Noto Serif Thai",Georgia,serif;
  --body:"Anuphan","Jost",system-ui,sans-serif;
  --label:"Jost","Anuphan",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}
body{background:var(--bg);color:var(--ivory);font-family:var(--body);font-weight:300;font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
img{display:block;max-width:100%}
:focus-visible{outline:1px solid var(--gold);outline-offset:4px}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.narrow{max-width:760px}
h1,h2,h3{font-family:var(--display);font-weight:300;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.005em}
:lang(th) h1,:lang(th) h2,:lang(th) h3{font-family:var(--thai-display);font-weight:300;line-height:1.35}
p{margin:0}
.lbl{font-family:var(--label);font-size:11px;font-weight:400;letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}
.lbl.g{color:var(--gold)}
:lang(th) .lbl{letter-spacing:.08em;font-size:12.5px;font-family:var(--body)}
.rule{width:44px;height:1px;background:var(--gold);border:0;margin:0}
.lead{color:#cfc6b9;font-size:17px;max-width:58ch}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(10,9,8,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:28px;height:68px}
.mark{font-family:var(--display);font-size:22px;letter-spacing:.24em;font-weight:400;white-space:nowrap}
.mark i{font-style:normal;color:var(--gold)}
nav{margin-left:auto}
nav ul{display:flex;gap:30px;list-style:none;margin:0;padding:0}
nav a{font-family:var(--label);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);transition:color .3s;position:relative;padding:6px 0}
:lang(th) nav a{font-family:var(--body);letter-spacing:.06em;font-size:14px;text-transform:none}
nav a:hover,nav a.on{color:var(--ivory)}
nav a.on::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1px;background:var(--gold)}
.lang{display:flex;gap:2px;font-family:var(--label);font-size:11px;letter-spacing:.18em}
.lang button{padding:4px 8px;color:var(--faint)}
.lang button[aria-pressed="true"]{color:var(--gold)}
.menu-btn{display:none;font-family:var(--label);font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--ivory)}
@media (max-width:900px){
  nav{position:fixed;inset:calc(68px + env(safe-area-inset-top,0px)) 0 0 0;background:var(--bg);padding:40px max(20px,env(safe-area-inset-left,0px));display:none}
  nav.open{display:block}
  nav ul{flex-direction:column;gap:22px}
  nav a{font-family:var(--display);font-size:30px;letter-spacing:.04em;text-transform:none;color:var(--ivory)}
  :lang(th) nav a{font-family:var(--thai-display);font-size:24px}
  .menu-btn{display:block;margin-left:auto}
  .lang{margin-left:8px}
  .bar{gap:14px}
  .mark{font-size:18px;letter-spacing:.16em}
}

main{min-height:70vh}
section{padding-block:120px}
.sec-head{display:flex;flex-direction:column;gap:18px;margin-bottom:56px}
.sec-head h2{font-size:clamp(36px,5vw,64px)}
.sec-head.row{flex-direction:row;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap}
.more{font-family:var(--label);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);display:inline-flex;gap:10px;align-items:center;white-space:nowrap}
:lang(th) .more{font-family:var(--body);letter-spacing:.04em;font-size:14px;text-transform:none}
.more::after{content:"";width:28px;height:1px;background:currentColor;transition:width .3s}
.more:hover::after{width:44px}

/* hero */
.hero{padding-block:72px 110px;position:relative;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:72px;align-items:center}
.hero h1{font-size:clamp(64px,10vw,150px);font-weight:300;letter-spacing:.06em;line-height:.9;font-family:var(--display)}
.hero h1 span{display:block}
.hero h1 span:last-child{font-style:italic;color:var(--gold);padding-left:.6em}
.hero .sub{margin-top:36px;display:flex;flex-direction:column;gap:22px}
.hero .lead{font-size:18px}
.cta{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}
.btn{font-family:var(--label);font-size:12px;letter-spacing:.24em;text-transform:uppercase;padding:16px 30px;border:1px solid var(--gold);color:var(--gold);transition:background .3s,color .3s}
:lang(th) .btn{font-family:var(--body);font-size:14px;letter-spacing:.06em;text-transform:none}
.btn:hover{background:var(--gold);color:var(--bg)}
.btn.ghost{border-color:var(--line);color:var(--ivory)}
.btn.ghost:hover{background:var(--ivory);color:var(--bg);border-color:var(--ivory)}
.frame{position:relative;padding:18px;background:linear-gradient(145deg,#1d1a17,#0e0d0c);box-shadow:0 40px 80px -30px rgba(0,0,0,.9),inset 0 0 0 1px #2c2724}
.frame::after{content:"";position:absolute;inset:8px;border:1px solid rgba(198,163,90,.22);pointer-events:none}
.hero .frame{aspect-ratio:1/1}
.slides{position:relative;width:100%;height:100%;overflow:hidden;background:#000}
.slides img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.6s ease}
.slides img.on{opacity:1}
.caption{display:flex;justify-content:space-between;gap:16px;margin-top:16px;font-family:var(--label);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.caption b{font-weight:400;color:var(--ivory);letter-spacing:.08em;text-transform:none;font-family:var(--display);font-size:17px;font-style:italic}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr;gap:48px}.hero{padding-top:48px}}
.figures{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);margin-top:96px}
.figures div{padding:28px 0 0;display:flex;flex-direction:column;gap:6px}
.figures b{font-family:var(--display);font-weight:300;font-size:clamp(40px,5vw,64px);line-height:1;color:var(--ivory)}

/* statement */
.statement{background:var(--room);border-block:1px solid var(--line)}
.statement blockquote{margin:0;font-family:var(--display);font-style:italic;font-weight:300;font-size:clamp(26px,3.4vw,42px);line-height:1.35;text-wrap:balance}
:lang(th) .statement blockquote{font-family:var(--thai-display);font-style:normal;font-size:clamp(22px,2.6vw,32px);line-height:1.7}
.statement .who{margin-top:32px;display:flex;align-items:center;gap:16px}

/* characters */
.chars{display:grid;grid-template-columns:repeat(3,1fr);gap:40px}
.char{display:flex;flex-direction:column;gap:18px}
.char .img{aspect-ratio:4/5;overflow:hidden;background:#000}
.char img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.char:hover img{transform:scale(1.04)}
.char h3{font-size:34px;letter-spacing:.08em}
.char p{color:var(--muted);font-size:15px}
@media (max-width:900px){.chars{grid-template-columns:1fr;gap:56px}}

/* collection cards */
.chapter{padding-block:80px;border-top:1px solid var(--line)}
.chapter:first-of-type{border-top:0;padding-top:0}
.ch-head{display:grid;grid-template-columns:140px 1fr;gap:32px;margin-bottom:48px;align-items:start}
.ch-num{font-family:var(--display);font-size:72px;font-weight:300;line-height:.8;color:var(--gold)}
.ch-head h2{font-size:clamp(32px,4vw,48px);margin-bottom:12px}
@media (max-width:700px){.ch-head{grid-template-columns:1fr;gap:12px}.ch-num{font-size:48px}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:48px 28px}
.card{display:flex;flex-direction:column;gap:16px;min-width:0}
.card .img{aspect-ratio:1/1;overflow:hidden;background:var(--wall);position:relative}
.card .img img{width:100%;height:100%;object-fit:cover;transition:transform 1s cubic-bezier(.2,.7,.2,1),filter .6s;filter:saturate(.92)}
.card:hover .img img{transform:scale(1.05);filter:saturate(1)}
.card h3{font-size:24px;transition:color .3s}
.card:hover h3{color:var(--gold)}
.card .meta{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.count{font-family:var(--label);font-size:11px;letter-spacing:.2em;color:var(--muted);white-space:nowrap}

/* room (collection) */
.room-head{padding-block:72px 64px;display:grid;grid-template-columns:1.1fr .9fr;gap:72px;align-items:end;border-bottom:1px solid var(--line)}
.room-head h1{font-size:clamp(44px,6vw,88px)}
.room-head .poster{aspect-ratio:1/1;max-width:440px;justify-self:end;width:100%}
.room-head .poster img{width:100%;height:100%;object-fit:cover}
.crumb{display:flex;gap:12px;align-items:center;margin-bottom:28px;flex-wrap:wrap}
.crumb a:hover{color:var(--gold)}
@media (max-width:900px){.room-head{grid-template-columns:1fr;gap:40px}.room-head .poster{justify-self:start;max-width:320px}}
.wall{columns:3 300px;column-gap:36px;padding-block:72px}
.piece{break-inside:avoid;margin-bottom:56px;display:block}
.piece .img{background:#000;overflow:hidden;box-shadow:0 30px 60px -30px rgba(0,0,0,.95)}
.piece img{width:100%;height:auto;transition:transform 1s cubic-bezier(.2,.7,.2,1)}
.piece:hover img{transform:scale(1.03)}
.piece .tag{display:flex;justify-content:space-between;gap:16px;align-items:baseline;padding-top:16px}
.piece h3{font-size:22px;transition:color .3s}
.piece:hover h3{color:var(--gold)}
.no{font-family:var(--label);font-size:11px;letter-spacing:.16em;color:var(--muted);white-space:nowrap}
.pager{display:flex;justify-content:space-between;gap:24px;border-top:1px solid var(--line);padding-block:40px 0;flex-wrap:wrap}
.pager a{display:flex;flex-direction:column;gap:6px;max-width:48%}
.pager a:last-child{text-align:right;margin-left:auto}
.pager b{font-family:var(--display);font-weight:300;font-size:26px}
:lang(th) .pager b{font-family:var(--thai-display);font-size:20px}
.pager a:hover b{color:var(--gold)}

/* artwork */
.art{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.65fr);gap:72px;padding-block:56px 100px;align-items:start}
.stage{background:radial-gradient(80% 70% at 50% 40%,#1c1916,#0a0908 75%);padding:clamp(20px,4vw,56px);display:grid;place-items:center;position:sticky;top:calc(88px + env(safe-area-inset-top,0px))}
.stage img{max-height:calc(100vh - 220px);width:auto;max-width:100%;box-shadow:0 50px 90px -40px #000}
.label{display:flex;flex-direction:column;gap:28px;padding-top:12px}
.label h1{font-size:clamp(36px,4vw,56px)}
.label dl{display:grid;grid-template-columns:auto 1fr;gap:12px 28px;margin:0;padding-block:24px;border-block:1px solid var(--line);font-size:15px}
.label dt{font-family:var(--label);font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);padding-top:4px}
:lang(th) .label dt{font-family:var(--body);letter-spacing:.04em;font-size:13px;text-transform:none}
.label dd{margin:0}
.label dd a{border-bottom:1px solid var(--gold-soft)}
.label dd a:hover{color:var(--gold)}
.mean{font-family:var(--thai-display);font-size:21px;line-height:1.75;font-weight:300}
.mean.en{font-family:var(--display);font-size:24px;line-height:1.5;font-style:italic}
.mean-alt{font-size:15px;color:var(--muted);line-height:1.8}
.cert{display:flex;gap:14px;align-items:flex-start;padding:18px 20px;background:var(--gold-soft);font-size:14px;color:#d9cdb5}
.cert svg{flex-shrink:0;margin-top:3px}
.nav-art{display:flex;gap:12px}
.nav-art a{flex:1;border:1px solid var(--line);padding:14px 16px;font-family:var(--label);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);transition:border-color .3s,color .3s;text-align:center}
:lang(th) .nav-art a{font-family:var(--body);font-size:13px;letter-spacing:.04em;text-transform:none}
.nav-art a:hover{border-color:var(--gold);color:var(--gold)}
@media (max-width:900px){.art{grid-template-columns:1fr;gap:40px;padding-top:24px}.stage{position:static}.stage img{max-height:none}}

/* artist */
.bio{display:grid;grid-template-columns:.9fr 1.1fr;gap:88px;align-items:start}
.bio .portrait{aspect-ratio:3/4;background:var(--wall);position:relative;overflow:hidden}
.bio .portrait img{width:100%;height:100%;object-fit:cover}
.bio h1{font-size:clamp(44px,5.4vw,76px);margin-block:18px 28px}
.journey{list-style:none;margin:56px 0 0;padding:0;border-top:1px solid var(--line)}
.journey li{display:grid;grid-template-columns:72px 1fr;gap:24px;padding-block:26px;border-bottom:1px solid var(--line)}
.journey .k{font-family:var(--display);font-style:italic;font-size:26px;color:var(--gold);line-height:1.2}
.journey h3{font-family:var(--body);font-weight:400;font-size:17px;margin-bottom:6px}
.journey p{color:var(--muted);font-size:15px}
.socials{display:flex;gap:14px;flex-wrap:wrap;margin-top:28px}
.social{display:inline-flex;align-items:center;gap:12px;padding:14px 22px;border:1px solid var(--gold);color:var(--gold);font-size:15px;transition:background .3s,color .3s;flex-wrap:wrap}
.social:hover{background:var(--gold);color:var(--bg)}
.social .handle{font-family:var(--label);font-size:11px;letter-spacing:.14em;opacity:.7}
.tt-band{padding-block:72px;border-bottom:1px solid var(--line)}
.tt-row{display:flex;justify-content:space-between;align-items:center;gap:32px;flex-wrap:wrap}
.tt-row h2{font-size:clamp(30px,3.6vw,46px);margin-block:14px 12px}
.sketches{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:28px}
.sketches img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#fff}
@media (max-width:900px){.bio{grid-template-columns:1fr;gap:48px}}

/* exhibitions */
.ex{display:grid;grid-template-columns:repeat(12,1fr);gap:24px}
.ex figure{margin:0;display:flex;flex-direction:column;gap:12px}
.ex figure img{width:100%;height:100%;object-fit:cover}
.ex .a{grid-column:span 8}.ex .b{grid-column:span 4}.ex .c{grid-column:span 5}.ex .d{grid-column:span 7}
.ex .ph{overflow:hidden;background:#000}
.ex .a .ph,.ex .d .ph{aspect-ratio:16/10}.ex .b .ph,.ex .c .ph{aspect-ratio:4/5}
@media (max-width:800px){.ex .a,.ex .b,.ex .c,.ex .d{grid-column:span 12}}

/* contact */
.contact{display:grid;grid-template-columns:1fr 1fr;gap:72px}
.channels{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.channels div{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-block:24px;border-bottom:1px solid var(--line)}
.channels b{font-family:var(--display);font-weight:300;font-size:28px}
@media (max-width:800px){.contact{grid-template-columns:1fr}}

footer{border-top:1px solid var(--line);padding-block:56px 48px;margin-top:40px}
.foot{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:end}
.foot .mark{font-size:18px}
.foot small{color:var(--faint);font-size:12px;font-family:var(--label);letter-spacing:.12em}

.fade{animation:fade .7s ease both}
@keyframes fade{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
</head>

  <div class="wrap bar">
    <a class="mark" href="#home">DODGE <i>HOODY</i></a>
    <nav id="nav" aria-label="Main"><ul id="menu"></ul></nav>
    <button class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="nav">Menu</button>

<script>window.DH={"chapters":[{"id":"origins","num":"I","en":"Origins","th":"จุดเริ่มต้น","ben":"The first DODGE HOODY works: a sleepy child in a hood, hiding from fear, sadness and the noise of the world.","bth":"ผลงานยุคแรกของ DODGE HOODY เด็กน้อยหลับตาในฮู้ดที่หลบจากความกลัว ความเศร้า และเสียงรบกวนของโลก"},{"id":"stories","num":"II","en":"Stories","th":"เรื่องเล่า","ben":"Numbered collections that grow from the same character into love, work, faith, travel and society.","bth":"คอลเลกชันลำดับต่อมาที่ขยายเรื่องราวของตัวละครเดิม สู่ความรัก การงาน ความเชื่อ การเดินทาง และสังคม"},{"id":"brave","num":"III","en":"BRAVE","th":"BRAVE","ben":"BRAVE opens its eyes. A new character with wide, watchful eyes who chooses to face things instead of hiding.","bth":"BRAVE ตัวละครที่ลืมตาขึ้น ดวงตากลมโตที่เลือกเผชิญหน้าแทนการหลบซ่อน"},{"id":"furr","num":"IV","en":"FURR","th":"FURR","ben":"FURR is BRAVE wrapped in fluffy fur: soft, colourful and built to comfort.","bth":"FURR คือ BRAVE ในชุดขนปุยนุ่ม สีสันสดใส สร้างมาเพื่อโอบกอดและปลอบใจ"},{"id":"special","num":"—","en":"Special Works","th":"ผลงานพิเศษ","ben":"One-off pieces, commissions and works made for a cause.","bth":"ผลงานชิ้นพิเศษ งานสั่งทำ และผลงานเพื่อการกุศล"}],"colls":[{"id":"beginning","ch":"origins","en":"The Beginning","th":"จุดเริ่มต้น","ben":"The very first DODGE HOODY drawings, where the hooded child and its quiet way of avoiding the world were born.","bth":"ผลงานชุดแรกของ DODGE HOODY จุดกำเนิดของเด็กน้อยในฮู้ดและวิธีหลบโลกอย่างเงียบๆ","p":"beginning","n":13,"pk":0},{"id":"circus","ch":"origins","en":"Dodge Circus","th":"ดอดจ์ เซอร์คัส","ben":"An August collection built around a circus: smiles, tricks and walls that hide what is really felt.","bth":"คอลเลกชันเดือนสิงหาคมในธีมละครสัตว์ รอยยิ้ม มายากล และกำแพงที่ซ่อนความรู้สึกจริง","p":"circus","n":4,"pk":0},{"id":"feelings","ch":"origins","en":"Feelings and Mind","th":"ความรู้สึกและจิตใจ","ben":"Pictures that tell stories from the mind from many angles, made to help heal the heart and let it rest.","bth":"ภาพที่เล่าเรื่องราวของจิตใจในหลายมุม เพื่อช่วยเยียวยาและให้ใจได้พัก","p":"feelings","n":11,"pk":0},{"id":"animalhood","ch":"origins","en":"Dodge Animal Hood Vol.1","th":"ดอดจ์ แอนิมอล ฮู้ด เล่ม 1","ben":"An October collection of animal hoods, each with its own story and way of thinking.","bth":"คอลเลกชันเดือนตุลาคม ฮู้ดสัตว์หลากชนิดที่แต่ละตัวมีเรื่องราวและความคิดของตัวเอง","p":"animalhood","n":4,"pk":0},{"id":"halloween","ch":"origins","en":"Dodge Halloween","th":"ดอดจ์ ฮาโลวีน","ben":"A festival night of spirits, magic and borrowed identities.","bth":"ค่ำคืนแห่งเทศกาลวิญญาณ เวทมนตร์ และตัวตนที่ได้สวมใส่ชั่วคราว","p":"halloween","n":7,"pk":0},{"id":"sleep","ch":"origins","en":"Dodge Animal Sleep","th":"ดอดจ์ แอนิมอล สลีป","ben":"Sleeping inside animal hoods: the quiet, warm places we go to rest.","bth":"หลับใหลในฮู้ดสัตว์ พื้นที่อบอุ่นและเงียบสงบที่เราไปพักผ่อน","p":"sleep","n":6,"pk":0},{"id":"unluck","ch":"origins","en":"Dodge Unluck","th":"ดอดจ์ อันลัค","ben":"Charms that turn bad luck away and call good fortune in.","bth":"เครื่องรางที่ปัดเป่าเคราะห์ร้ายและเรียกโชคดีเข้ามา","p":"unluck","n":4,"pk":0},{"id":"life","ch":"origins","en":"Dodge Life","th":"ดอดจ์ ไลฟ์","ben":"The story of life from beginning to end, and what we carry forward.","bth":"เรื่องราวของชีวิตตั้งแต่ต้นจนจบ และสิ่งที่เราส่งต่อ","p":"life","n":6,"pk":0},{"id":"winter","ch":"origins","en":"Dodge Monster Winter","th":"ดอดจ์ มอนสเตอร์ วินเทอร์","ben":"Winter creatures and small kindnesses that keep cold nights warm.","bth":"สัตว์ประหลาดฤดูหนาวและความใจดีเล็กๆ ที่ทำให้ค่ำคืนหนาวเหน็บอบอุ่น","p":"winter","n":6,"pk":0},{"id":"zodiac","ch":"origins","en":"Dodge Zodiac","th":"ดอดจ์ โซดิแอค","ben":"All twelve signs of the zodiac, drawn as DODGE HOODY.","bth":"ทั้ง 12 ราศีในแบบของ DODGE HOODY","p":"zodiac","n":12,"pk":0},{"id":"mascot","ch":"origins","en":"Dodge Mascot","th":"ดอดจ์ มาสคอต","ben":"Mascots that wear a cute face for the world while hiding the real self inside.","bth":"มาสคอตที่สวมใบหน้าน่ารักให้โลกเห็น แต่ซ่อนตัวตนจริงไว้ข้างใน","p":"mascot","n":4,"pk":0},{"id":"safetravel","ch":"origins","en":"Dodge Safe Travel","th":"ดอดจ์ เซฟ ทราเวล","ben":"Gentle giants that carry us safely through the day.","bth":"สัตว์ยักษ์ใจดีที่พาเราเดินทางอย่างปลอดภัยในทุกวัน","p":"safetravel","n":2,"pk":0},{"id":"lovestory","ch":"origins","en":"Dodge Love Story","th":"ดอดจ์ เลิฟ สตอรี่","ben":"Love in many forms, seen from each person's own perspective.","bth":"ความรักในหลากหลายรูปแบบ ผ่านมุมมองของแต่ละคน","p":"lovestory","n":8,"pk":0},{"id":"sweets","ch":"origins","en":"Dodge Sweets","th":"ดอดจ์ สวีทส์","ben":"The sweetness of desserts, and how quickly sweetness passes.","bth":"ความหวานของขนม และความหวานที่ผ่านไปอย่างรวดเร็ว","p":"sweets","n":3,"pk":0},{"id":"cny","ch":"origins","en":"Dodge Chinese New Year","th":"ดอดจ์ ตรุษจีน","ben":"Auspicious figures that bring fortune, wealth and happiness for the new year.","bth":"สัญลักษณ์มงคลที่นำโชคลาภ ความมั่งคั่ง และความสุขรับปีใหม่","p":"cny","n":6,"pk":0},{"id":"sleep2","ch":"stories","en":"Dodge Animal Sleep Vol.2","th":"ดอดจ์ แอนิมอล สลีป เล่ม 2","ben":"More sleeping companions: rest, safety and dreams shared together.","bth":"เพื่อนหลับฝันชุดใหม่ การพักผ่อน ความปลอดภัย และความฝันที่แบ่งปันกัน","p":"sleep2","n":4,"pk":0},{"id":"childhood","ch":"stories","en":"Dodge Childhood Fun","th":"ดอดจ์ ไชลด์ฮูด ฟัน","ben":"A hideout from adult problems, back to the fun and familiar characters of childhood.","bth":"ที่หลบจากปัญหาผู้ใหญ่ ย้อนกลับไปสู่ความสนุกและตัวการ์ตูนที่คุ้นเคยในวัยเด็ก","p":"childhood","n":4,"pk":0},{"id":"valentine","ch":"stories","en":"Dodge Valentine","th":"ดอดจ์ วาเลนไทน์","ben":"Stories of love: what it gives, what it breaks and what it teaches.","bth":"เรื่องราวของความรัก สิ่งที่รักมอบให้ สิ่งที่รักทำให้แตกสลาย และสิ่งที่รักสอนเรา","p":"valentine","n":8,"pk":0},{"id":"work","ch":"stories","en":"Dodge Work & Wealth","th":"ดอดจ์ เวิร์ค แอนด์ เวลธ์","ben":"Work and money are what people endlessly seek. Where is the balance between happiness and need?","bth":"การงานและเงินคือสิ่งที่มนุษย์ไขว่คว้าไม่สิ้นสุด แล้วสมดุลระหว่างความสุขกับความต้องการอยู่ตรงไหน","p":"work","n":5,"pk":0},{"id":"masks","ch":"stories","en":"Masks of Society","th":"หน้ากากแห่งสังคม","ben":"The masks people wear in society to fit in, hide the truth, or simply survive.","bth":"หน้ากากที่ผู้คนสวมในสังคม เพื่อให้กลมกลืน ซ่อนความจริง หรือเพียงเพื่อเอาตัวรอด","p":"masks","n":3,"pk":0},{"id":"storytelling","ch":"stories","en":"Dodge Hoody Stories","th":"ดอดจ์ ฮู้ดดี้ สตอรี่","ben":"Imagination told through drawing, using DODGE HOODY as the storyteller.","bth":"เล่าจินตนาการผ่านภาพวาด โดยมี DODGE HOODY เป็นผู้เล่าเรื่อง","p":"storytelling","n":3,"pk":0},{"id":"mongkhon","ch":"stories","en":"Dodge Mongkhon","th":"ดอดจ์ มงคล","ben":"Auspicious deities and symbols of faith, for prosperity and good fortune.","bth":"เทพเจ้าและสัญลักษณ์มงคลแห่งความศรัทธา เพื่อความรุ่งเรืองและโชคลาภ","p":"mongkhon","n":5,"pk":0},{"id":"social","ch":"stories","en":"Dodge Social","th":"ดอดจ์ โซเชียล","ben":"Life in society: the faces we change, the colours that stand out, and the support that protects us.","bth":"ชีวิตในสังคม ใบหน้าที่ต้องเปลี่ยน สีที่โดดเด่น และกำลังใจที่คอยปกป้อง","p":"social","n":4,"pk":0},{"id":"travel","ch":"stories","en":"Dodge Travel: Japan","th":"ดอดจ์ ทราเวล ญี่ปุ่น","ben":"Escaping chaos to places that make you forget everything, then coming back ready to face it again.","bth":"หลบความวุ่นวายไปยังที่ที่ทำให้ลืมทุกอย่าง แล้วกลับมาพร้อมสู้ต่อ","p":"travel","n":5,"pk":0},{"id":"hugs","ch":"stories","en":"Dodge Hugs","th":"ดอดจ์ ฮักส์","ben":"A hug adds positive energy and protects us from the negative. Its meaning changes with who gives it.","bth":"อ้อมกอดเพิ่มพลังบวกและปกป้องจากพลังลบ ความหมายของกอดเปลี่ยนไปตามผู้ให้","p":"hugs","n":2,"pk":0},{"id":"protect","ch":"stories","en":"Dodge Protect","th":"ดอดจ์ โพรเทค","ben":"The many ways we protect the people and things we love.","bth":"หลากหลายวิธีที่เราปกป้องคนและสิ่งที่เรารัก","p":"protect","n":4,"pk":0},{"id":"animalsociety","ch":"stories","en":"Dodge Animal Society","th":"ดอดจ์ แอนิมอล โซไซตี้","ben":"Society seen through animals, and the roles we are chosen for.","bth":"สังคมผ่านมุมมองของสัตว์ และบทบาทที่เราถูกเลือก","p":"animalsociety","n":1,"pk":0},{"id":"firsttime","ch":"stories","en":"The First Time","th":"ครั้งแรก","ben":"A mother, a warrior, their monster and mine: the first embraces that shape us.","bth":"แม่ นักรบ สัตว์ประหลาดของพวกเขาและของฉัน อ้อมกอดแรกที่หล่อหลอมเรา","p":"firsttime","n":3,"pk":0},{"id":"rabbitdream","ch":"stories","en":"Dodge Rabbit Dream","th":"ดอดจ์ แรบบิท ดรีม","ben":"A dream world where the mind can rest and gather light for tomorrow.","bth":"โลกแห่งความฝันที่ใจได้พักและเก็บแสงสว่างไว้สำหรับวันพรุ่งนี้","p":"rabbitdream","n":2,"pk":0},{"id":"goldzodiac","ch":"stories","en":"The Gold Zodiac","th":"เดอะ โกลด์ โซดิแอค","ben":"The zodiac reimagined in gold, the colour of wealth and beauty.","bth":"12 ราศีในโทนทองคำ สีแห่งความมั่งคั่งและความงาม","p":"goldzodiac","n":12,"pk":0},{"id":"newyear","ch":"stories","en":"Dodge New Year","th":"ดอดจ์ นิวเยียร์","ben":"Lucky animals that open the year with fortune.","bth":"สัตว์นำโชคที่เปิดศักราชใหม่ด้วยโชคลาภ","p":"newyear","n":2,"pk":0},{"id":"expectation","ch":"stories","en":"Expectation","th":"ความคาดหวัง","ben":"Stories of expectation in many contexts, and what it does to the self.","bth":"เรื่องราวของความคาดหวังในหลายบริบท และสิ่งที่มันทำกับตัวตน","p":"expectation","n":3,"pk":0},{"id":"song","ch":"stories","en":"Inspired by the Song","th":"แรงบันดาลใจจากเพลง","ben":"Drawings that carry the story of meaningful songs and the emotions they hold.","bth":"ภาพวาดที่ถ่ายทอดเรื่องราวจากบทเพลงที่มีความหมาย และอารมณ์ในเพลงนั้น","p":"song","n":4,"pk":0},{"id":"puppet","ch":"stories","en":"Dodge Puppet","th":"ดอดจ์ พัพเพ็ท","ben":"Being a puppet is not always forced. Sometimes we tie the strings ourselves.","bth":"การเป็นหุ่นเชิดไม่ได้ถูกบังคับเสมอไป บางครั้งเราผูกเชือกนั้นเอง","p":"puppet","n":4,"pk":0},{"id":"facets","ch":"stories","en":"Facets of Love","th":"หลากแง่มุมของความรัก","ben":"Love presented from different perspectives, drawn from characters in literature.","bth":"ความรักในมุมมองที่แตกต่าง ถ่ายทอดจากตัวละครในวรรณกรรม","p":"facets","n":4,"pk":0},{"id":"healing","ch":"stories","en":"Social Healing","th":"โซเชียลฮีลลิ่ง","ben":"The social world can feel cruel, but it also holds acceptance that heals.","bth":"โลกโซเชียลอาจดูโหดร้าย แต่ก็มีการยอมรับที่ช่วยเยียวยาหัวใจ","p":"healing","n":4,"pk":0},{"id":"literature","ch":"stories","en":"The Era of Literature","th":"ยุคแห่งวรรณคดี","ben":"The duality of the Buddha in Thai literature: opposites bound together that cannot be separated.","bth":"ความเป็นคู่ขัดแย้งในวรรณคดี สองขั้วที่ผูกพันและแยกจากกันไม่ได้","p":"literature","n":2,"pk":0},{"id":"brave20","ch":"brave","en":"BRAVE 20","th":"BRAVE 20","ben":"Twenty kinds of courage, from tiny sparks to stepping out of the castle.","bth":"ความกล้าหาญ 20 แบบ ตั้งแต่ประกายไฟเล็กๆ จนถึงการก้าวออกจากปราสาท","p":"brave20","n":18,"pk":0},{"id":"brave40","ch":"brave","en":"BRAVE 40","th":"BRAVE 40","ben":"Twenty more ways to be brave, closing the BRAVE series at forty.","bth":"ความกล้าอีก 20 แบบ ปิดซีรีส์ BRAVE ครบ 40 ภาพ","p":"brave40","n":19,"pk":0},{"id":"energy","ch":"brave","en":"Energy of Lifes","th":"พลังแห่งชีวิต","ben":"The different energies that keep a life moving.","bth":"พลังงานหลากรูปแบบที่ขับเคลื่อนชีวิต","p":"energy","n":8,"pk":0},{"id":"love2","ch":"brave","en":"Love Story 2","th":"เลิฟ สตอรี่ 2","ben":"Love through BRAVE: each person sees love differently, with many emotions.","bth":"ความรักผ่านตัวละคร BRAVE แต่ละคนมองความรักต่างกัน และมีอารมณ์หลากหลาย","p":"love2","n":8,"pk":0},{"id":"outerinner","ch":"brave","en":"Outer & Inner","th":"ภายนอกและภายใน","ben":"What people see outside is often the opposite of what lives inside.","bth":"สิ่งที่คนอื่นเห็นภายนอก มักตรงข้ามกับสิ่งที่อยู่ข้างใน","p":"outerinner","n":8,"pk":0},{"id":"dare","ch":"brave","en":"Dare to Be Yourself","th":"กล้าที่จะเป็นตัวเอง","ben":"Dare to be yourself. Not everyone will understand, and that is enough.","bth":"กล้าที่จะเป็นตัวเอง แม้ไม่ใช่ทุกคนจะเข้าใจ ก็เพียงพอแล้ว","p":"dare","n":4,"pk":0},{"id":"pastplay","ch":"brave","en":"Past & Play","th":"อดีตและการเล่น","ben":"The toys and games of the past, and the lessons they still carry.","bth":"ของเล่นและเกมในอดีต และบทเรียนที่ยังติดตัวมา","p":"pastplay","n":12,"pk":0},{"id":"furflowers","ch":"furr","en":"Fur & Flowers","th":"ขนนุ่มและดอกไม้","ben":"FURR meets flowers: each animal and bloom carries a meaning that supports the other.","bth":"FURR กับดอกไม้ สัตว์และดอกไม้แต่ละชนิดมีความหมายที่เกื้อหนุนกัน","p":"furflowers","n":6,"pk":0},{"id":"furdessert","ch":"furr","en":"Fur & Dessert","th":"ขนนุ่มและของหวาน","ben":"Cute FURR paired with desserts, a soft escape from everyday tiredness.","bth":"FURR แสนน่ารักคู่กับของหวาน ที่หลบอันนุ่มนวลจากความเหนื่อยล้าในทุกวัน","p":"furdessert","n":7,"pk":0},{"id":"furhugs","ch":"furr","en":"Fur & Hugs","th":"ขนนุ่มและอ้อมกอด","ben":"Hugs from FURR that tell stories of society and feelings we have not yet experienced.","bth":"อ้อมกอดจาก FURR ที่เล่าเรื่องสังคมและความรู้สึกในมุมมองใหม่","p":"furhugs","n":4,"pk":0},{"id":"soaks","ch":"furr","en":"Fur & Seasonal Soaks","th":"ขนนุ่มกับการแช่น้ำสี่ฤดู","ben":"When the seasons change, the heart needs rest. Four soaks through the year.","bth":"เมื่อฤดูเปลี่ยน หัวใจก็ต้องการพัก การแช่น้ำผ่อนคลายทั้งสี่ฤดู","p":"soaks","n":4,"pk":0},{"id":"fashion","ch":"furr","en":"Fur & Fashion","th":"ขนนุ่มและแฟชั่น","ben":"FURR in a clear, fluffy dress style, because dressing is an expression of who we are.","bth":"FURR ในสไตล์การแต่งตัวที่ชัดเจน เพราะการแต่งตัวคือการแสดงออกถึงตัวตน","p":"fashion","n":4,"pk":0},{"id":"furdreams","ch":"furr","en":"Fur & Dreams","th":"ขนนุ่มและความฝัน","ben":"Dreams of sweet clouds, old toys, bubbles and the moon.","bth": ervitude-017","t":"Servitude","n":"#017","c":"circus","th":"ถูกบังคับให้ทำสิ่งที่ไม่ใช่ตัวเอง ยอมทำทุกอย่างเพื่อความอยู่รอด","en":"Forced to do what isn't yours, willing to do anything to survive.","r":1.0,"k":2},{"id":"circus-invisible-wall-018","t":"Invisible Wall","n":"#018","c":"circus","th":"จินตนาการสร้างกำแพงในใจเพื่อปิดกั้นความรู้สึก","en":"Imagination builds walls in the mind to shut out feelings.","r":1.0,"k":2},{"id":"circus-magic-is-not-reality-019","t":"Magic Is Not Reality","n":"#019","c":"circus","th":"ภาพลวงตาที่ตื่นเต้นชั่วครู่ แต่ไม่ใช่ความจริง","en":"An illusion that thrills for a moment but isn't real.","r":1.0,"k":2},{"id":"beginning-drago-hater-020","t":"DRAGO HATER","n":"#020","c":"beginning","th":"เด็กน้อยที่ใช้ความกล้าหาญเผชิญปัญหาต่างๆ","en":"A young boy who finds the courage to face his problems.","r":1.0,"k":2},{"id":"feelings-deep-hole-in-the-heart-021","t":"Deep Hole in the Heart","n":"#021","c":"feelings","th":"เวลาชีวิตเริ่มสั้นลง แต่หลุมในใจกลับลึกขึ้น","en":"Life grows shorter, yet the hole in the heart grows deeper.","r":1.001,"k":2},{"id":"feelings-broken-022","t":"Broken","n":"#022","c":"feelings","th":"สิ่งที่แตกหักพังสลาย ซ่อมอย่างไรก็ไม่มีทางกลับเป็นเหมือนเดิม","en":"What is broken stays broken. However you repair it, it never returns to how it was.","r":1.0,"k":2},{"id":"feelings-colors-hidden-in-strength-023","t":"Colors Hidden in Strength","n":"#023","c":"feelings","th":"ถึงจะแข็งแกร่งภายนอก แต่ลึกๆ ภายในจิตใจยังมีสีสันที่ซ่อนอยู่","en":"Strong on the outside, with colours hidden deep inside.","r":1.001,"k":2},{"id":"feelings-mindless-puppet-024","t":"Mindless Puppet","n":"#024","c":"feelings","th":"เมื่อไร้จิตใจไร้ความรู้สึก ก็กลายเป็นเพียงหุ่นเชิดที่ถูกชักไปมา","en":"Without a mind or feelings, we become a puppet pulled around by strings.","r":1.0,"k":2},{"id":"feelings-deep-025","t":"Deep","n":"#025","c":"feelings","th":"จิตใจดำดิ่งลึกลงไปเรื่อยๆ เมื่อเจอคำพูดเป็นพิษบนโลกออนไลน์","en":"The mind sinks deeper each time it ับเสียงเล็กๆ ที่ได้ยินยามเช้า ช่วงเวลาที่ไม่ต้องจริงจังกับชีวิต","en":"Childhood fun and the little voices of the morning, a time when life didn't need to be serious.","r":1.0,"k":4},{"id":"childhood-the-sweetness-of-childhood-108","t":"The Sweetness of Childhood","n":"#108","c":"childhood","th":"ความหวานที่ทำให้ไม่ต้องโฟกัสทุกสิ่งที่เกิดขึ้น ช่วงเวลาแห่งความสุข","en":"A sweetness that lets us forget everything happening around us, a time of pure happiness.","r":1.0,"k":4},{"id":"childhood-childhood-delights-109","t":"Childhood Delights","n":"#109","c":"childhood","th":"ความสนุกในวัยเด็กเหมือนหลุดไปอีกโลกหนึ่ง อยากกลับไปช่วงเวลานั้นอีกสักครั้ง","en":"Childhood joy felt like another world. We wish we could go back just once more.","r":1.0,"k":4},{"id":"valentine-the-wind-gently-embraces-what-has-gone-110","t":"The Wind Gently Embraces What Has Gone","n":"#110","c":"valentine","th":"การสูญเสียสิ่งที่รักเหมือนร่างและใจแตกสลาย แต่บางครั้งสายลมก็มาโอบกอด ให้รู้ว่าสิ่งที่จากไปยังอยู่ข้างเรา แม้จะมองไม่เห็นหรือสัมผัสไม่ได้","en":"Losing someone you love breaks body and heart, yet sometimes the wind holds you and you feel they are still near, even unseen.","r":1.0,"k":4},{"id":"valentine-heart-s-thread-the-choice-of-love-111","t":"Heart's Thread: The Choice of Love","n":"#111","c":"valentine","th":"ในโลกที่ด้ายแดงถูกมองว่าเป็นโชคชะตา แท้จริงหัวใจควรเป็นผู้เลือกและผูกด้ายแดงด้วยตัวเอง ไม่ใช่พรหมลิขิตที่บังคับ","en":"The red thread is called destiny, but the heart should choose and tie it itself, not follow a path drawn in advance.","r":1.0,"k":4},{"id":"valentine-love-passes-through-112","t":"Love Passes Through","n":"#112","c":"valentine","th":"ความรักคือเฉดสีหลากหลายที่ไหลผ่านเข้ามา ซึมซับบางส่วนและปล่อยให้ไหลผ่านไป หล่อหลอมให้เราเป็นตัวเราที่ดีขึ้น","en":"Love is many shades flowing through us. We keep some, let the rest pass, and become better for it.","r":1.0,"k":4},{"id":"valentine-love-before-it-s-too-late-113","t":"Love Before It's Too Late","n":"#113","c":"valentine","th":"อย่ามัวรอเวลาในการแสดงความรัก เพราะไม่มีสิ่งใดอยู่กับเราตลอดไป เติมเต็มให้กันก่อนจะเสียใจในวันที่จากลา","en":"Don't wait to show love. Nothing stays forever, so give it now before goodbye brings regret.","r":1.0,"k":4},{"id":"valentine-embrace-yourself-first-114","t":"Embrace Yourself First","n":"#114","c":"valentine","th":"แม้เคยแตกร้าวจากความรัก อย่ามัวให้ความรักกับคนที่ไม่เห็นค่า กอดตัวเองให้มาก และให้คุณค่ากับตัวเองก่อนใคร","en":"Even if love has cracked you, stop giving it to those who don't value it. Hold yourself and value yourself first.","r":1.0,"k":4},{"id":"valentine-when-cupid-is-replaced-115","t":"When Cupid Is Replaced","n":"#115","c":"valentine","th":"ในยุคที่ความรักถูกปัดซ้ายปัดขวา กามเทพยังจำเป็นอยู่หรือไม่ เมื่อเทคโนโลยีจับคู่ให้ได้ง่ายดาย","en":"In an age of swiping left and right, is Cupid still needed when technology matches us so easily?","r":1.0,"k":4},{"id":"valentine-love-s-fragile-hourglass-116","t":"Love's Fragile Hourglass","n":"#116","c":"valentine","th":"นาฬิกาทรายแห่งความรักเมื่อแตก เม็ดทรายแห่งความผูกพันก็กระจายและลอยหายไป อย่าคาดหวังว่าสิ่งที่แตกไปแล้วจะกลับมาเหมือนเดิม รักษาไว้ให้ดี","en":"When love's hourglass breaks, the sand of our bond scatters and is gone. What shatters never returns the same, so take care of it.","r":1.0,"k":4},{"id":"valentine-blooming-emotions-118","t":"Blooming Emotions","n":"#118","c":"valentine","th":"บางครั้งความรักไม่ได้มีเพียงด้านเดียว มันคือการเติบโต การยอมรับ และการปล่อยให้ความรู้สึกเบ่งบานในแบบของมัน","en":"Love is never one-sided. It is growing, accepting, and letting feelings bloom in their own way.","r":1.0,"k":4},{"id":"work-passive-income-119","t":"Passive Income","n":"#119","c":"work","th":"ถ้าต้องทำงานตลอดชีวิตเพื่อหาเงิน แสดงว่ายังไม่มี Passive Income อย่างแท้จริง คือการให้เงินทำงานแทนเรา จนวันหนึ่งใช้ชีวิตได้โดยไม่ต้องแลกเวลาทั้งหมด","en":"If you must work your whole life for money, you don't yet have true passive income: money working for you until life no longer costs all your time.","r":1.0,"k":5},{"id":"work-dare-to-change-to-find-freedom-120","t":"Dare to Change to Find Freedom","n":"#120","c":"work","th":"ชีวิตเล็กๆ ที่กล้าทำสิ่งที่แตกต่าง เหมือนงานที่วนอยู่ในลูป บางครั้งต้องกล้าออกจากกรอบเพื่อค้นพบสิ่งที่มีความหมาย","en":"A small life that dares to be different. Work can loop forever; sometimes you must step outside to find what matters.","r":1.0,"k":5},{"id":"work-flame-of-work-121","t":"Flame of Work","n":"#121","c":"work","th":"บางครั้งแสงที่มอบให้กับงานต้องแลกด้วยการหลอมละลายตัวเอง แม้เงินทองจะมากขึ้น แต่สุขภาพและชีวิตก็มีค่าไม่แพ้กัน ดูแลตัวเองก่อนไฟของชีวิตจะมอดดับ","en":"The light we give to work can melt us away. Money grows, but health and life matter just as much. Care for yourself before your flame goes out.","r":1.0,"k":5},{"id":"work-rabbit-runs-with-time-122","t":"Rabbit Runs with Time","n":"#122","c":"work","th":"เวลาไม่เคยรอใคร ทำตัวให้เป็นกระต่ายที่วิ่งแข่งกับเวลา งานมีขึ้นมีลงเหมือนกราฟ วิ่งให้ทันและอย่าพลาดช่วงเวลาที่ดี","en":"Time waits for no one. Be the rabbit racing the clock; work rises and falls like a graph, so keep up and don't miss the good moments.","r":1.0,"k":5},{"id":"work-golden-words-golden-wealth-123","t":"Golden Words, Golden Wealth","n":"#123","c":"work","th":"วาจาที่ดีเปรียบดั่งทองคำ เปิดประตูสู่ความมั่งคั่ง สร้างโอกาส และนำโชคลาภมาไม่รู้จบ","en":"Kind words are gold. They open doors to wealth, create opportunity and bring endless fortune.","r":1.0,"k":5},{"id":"masks-mask-of-deception-127","t":"Mask of Deception","n":"#127","c":"masks","th":"สวมหน้ากากปิดตัวตนเพื่อเข้าฝูงให้ดูกลมกลืนและน่าไว้ใจ แม้ไม่ใช่ตัวตนจริง แต่เพื่อความอยู่รอดก็อาจจำเป็น","en":"Wearing a mask to blend into the flock and seem trustworthy. It isn't who we are, but survival may require it.","r":1.0,"k":5},{"id":"masks-digital-masquerade-128","t":"Digital Masquerade","n":"#128","c":"masks","th":"ในโลกโซเชียล เราต่างสวมหน้ากากฟิลเตอร์ที่แต่งเติมความสมบูรณ์แบบ ภาพบนจอเต็มไปด้วยคำชมและหัวใจ แต่เบื้องหลังคือตัวตนที่ถูกกดทับด้วยแรงกดดันจากสังคม","en":"Online we all wear filter masks of perfection. The screen fills with praise and hearts, while behind it the real self is pressed down by social pressure.","r":1.0,"k":5},{"id":"masks-the-blooming-mask-130","t":"The Blooming Mask","n":"#130","c":"masks","th":"หน้ากากที่แต่งเติมด้วยดอกไม้ เหมือนการสร้างบุคลิกให้สวยงามในทุกวัน เพราะสายตาสังคมส่งผลต่อเราในการเข้าสังคม","en":"A mask decorated with flowers, like the polished persona we build each day because society is always watching.","r":1.0,"k":5},{"id":"storytelling-balance-of-emotions-131","t":"Balance of Emotions","n":"#131","c":"storytelling","th":"ไม่มีขาวที่ชัดเจนหรือดำที่สนิท ทุกสิ่งเกิดจากหลากสีที่ผสมกัน อารมณ์ รัก โลภ โกรธ หลง มีอยู่ในทุกคน หากควบคุมได้อย่างสมดุล โลกก็สงบสุข","en":"There is no pure white or pure black. Love, greed, anger and delusion live in everyone; held in balance, the world finds peace.","r":0.713,"k":5},{"id":"storytelling-the-endless-pursuit-of-knowledge-132","t":"The Endless Pursuit of Knowledge","n":"#132","c":"storytelling","th":"ความรู้ไม่มีที่สิ้นสุด และการเรียนรู้คือกระบวนการตลอดชีวิต เด็กในชุดนกฮูก สัญลักษณ์แห่งปัญญา อ่านหนังสือท่ามกลางนกฮูกตัวเล็กที่เฝ้ามอง","en":"Knowledge has no end and learning lasts a lifetime. A child in an owl hood, the symbol of wisdom, reads among little owls who watch over.","r":0.713,"k":5},{"id":"storytelling-total-freedom-133","t":"Total Freedom","n":"#133","c":"storytelling","th":"กล้าที่จะออกจากจุดที่ถูกควบคุม ไปสู่อิสระที่เป็นตัวเรา ถ้าไม่เริ่มแตกออกจากพื้นที่ที่ถูกควบคุม ก็ไม่มีทางพบสิ่งที่เราอยากเป็น","en":"Dare to leave what controls you for the freedom of being yourself. Without breaking out, you'll never find who you want to be.","r":0.713,"k":5},{"id":"mongkhon-shree-ganesha-of-prosperity-134","t":"Shree Ganesha of Prosperity","n":"#134","c":"mongkhon","th":"พระพิฆเนศ เทพแห่งความสำเร็จและโชคลาภ สื่อถึงความมั่งคั่ง ความก้าวหน้าในธุรกิจ และการขจัดอุปสรรค","en":"Ganesha, god of success and fortune, stands for prosperity, progress in business and the removal of obstacles.","r":1.0,"k":5},{"id":"mongkhon-goddess-lakshmi-134","t":"Goddess Lakshmi","n":"#134","c":"mongkhon","th":"พระแม่ลักษมี สัญลักษณ์แห่งความเจริญรุ่งเรือง ความบริสุทธิ์ และความเมตตา ผู้บูชาด้วยใจบริสุทธิ์จะค้าขายรุ่งเรืองและชีวิตเปี่ยมสุข","en":"Lakshmi, goddess of prosperity, purity and compassion. Those who worship with a pure heart are blessed with thriving trade and a joyful life.","r":1.0,"k":5},{"id":"mongkhon-goddess-of-earth-and-prosperity-phra-mae-thorani-13","t":"Goddess of Earth and Prosperity (Phra Mae Thorani)","n":"#135","c":"mongkhon","th":"พระแม่ธรณี สัญลักษณ์แห่งความอุดมสมบูรณ์และการขจัดอุปสรรค ช่วยให้การค้ารุ่งเรือง ดั่งแผ่นดินที่รองรับและหล่อเลี้ยงทุกชีวิต","en":"Mother Earth, symbol of abundance and the removal of obstacles, helping trade grow like the land that supports every life.","r":1.0,"k":5},{"id":"mongkhon-nang-kwak-of-infinite-wealth-136","t":"Nang Kwak of Infinite Wealth","n":"#136","c":"mongkhon","th":"นางกวักแห่งความมั่งคั่งไม่สิ้นสุด ดึงดูดโชคลาภ เงินทอง และความเจริญรุ่งเรืองให้ธุรกิจและการค้าขาย","en":"Nang Kwak of endless wealth draws fortune, money and prosperity to business and trade.","r":1.0,"k":5},{"id":"mongkhon-two-realms-united-161","t":"Two Realms United","n":"#161","c":"mongkhon","th":"ความศรัทธาโชคลาภของสองภพที่ผนวกรวมกัน แม้โลกาภิวัตน์จะหมุนไปไม่สิ้นสุด ความศรัทธาก็ยังหมุนตามกระแสนวัตกรรม ทั้งสองอยู่ร่วมกันและเสริมบารมีให้กัน","en":"Faith and fortune from two worlds joined together. As the world keeps turning, belief moves with innovation, and each strengthens the other.","r":1.0,"k":5},{"id":"social-bubble-bear-140","t":"Bubble Bear","n":"#140","c":"social","th":"สิ่งที่ปกป้องจากคำคนในสังคมได้ดีที่สุดคือกำลังใจจากครอบครัว คำพูดที่เสียดแทงเหมือนมีด แต่ครอบครัวคือบับเบิลแบร์ที่คอยป้องกัน","en":"The best shield against people's words is family. Words cut like knives, but family is the bubble bear that keeps them out.","r":1.0,"k":5},{"id":"social-activity-face-141","t":"Activity Face","n":"#141","c":"social","th":"หน้าที่เราต้องเปลี่ยนไปตามบทบาทในแต่ละสังคมและเหตุการณ์ อาจเหนื่อยที่ต้องเปลี่ยน แต่เป็นสิ่งที่ต้องทำ","en":"The faces we change for each role and situation. It's tiring, but it has to be done.","r":1.0,"k":5},{"id":"social-different-colors-142","t":"Different Colors","n":"#142","c":"social","th":"สีที่แตกต่างมักเด่นและไม่เข้าพวก แม้พื้นฐานจะเหมือนกัน แตกต่างแต่ไม่สร้างความแตกแยก ก็ไม่จำเป็นต้องเปลี่ยน","en":"A different colour stands out and doesn't fit in, though we're the same underneath. Different without division needs no changing.","r":1.0,"k":5},{"id":"social-light-shines-143","t":"Light Shines","n":"#143","c":"social","th":"มองข้ามคำคนที่ดูหมิ่น แล้วเดินบนเส้นทางที่ตนเลือก แม้มีแสงเพียงน้อยนิดที่ปลายทาง สักวันจะถึงสิ่งที่หวัง","en":"Ignore those who look down on you and walk your own path. Even with only a little light ahead, one day you'll reach it.","r":1.0,"k":5},{"id":"travel-dodge-osaka-144","t":"Dodge Osaka","n":"#144","c":"travel","th":"หลบความวุ่นวายไปสู่เมืองในฝันที่ปลดปล่อยตัวตนและเพลิดเพลินกับอาหาร","en":"Escaping chaos to a dream city to set yourself free and enjoy the food.","r":1.404,"k":5},{"id":"travel-dodge-shinjuku-145","t":"Dodge Shinjuku","n":"#145","c":"travel","th":"หลบความวุ่นวายไปสู่เมืองที่เต็มไปด้วยความสนุก แสงสีที่เพลิดเพลิน","en":"Escaping chaos to a city full of fun and bright lights.","r":1.402,"k":5},{"id":"travel-dodge-tsukiji-146","t":"Dodge Tsukiji","n":"#146","c":"travel","th":"หลบความวุ่นวายไปสู่แหล่งรวมอาหารทะเลสดใหม่ ที่เพลิดเพลินทั้งการกินและบรรยากาศ","en":"Escaping chaos to the fresh seafood market, enjoying both the food and the atmosphere.","r":1.404,"k":5},{"id":"travel-dodge-sensoji-temple-147","t":"Dodge Sensoji Temple","n":"#147","c":"travel","th":"หลบความวุ่นวายไปสู่วิถีแห่งการขอพร เสริมดวงเพื่อความเป็นสิริมงคลของชีวิต","en":"Escaping chaos to a place of prayer, seeking blessings for a fortunate life.","r":1.404,"k":5},{"id":"travel-dodge-friendship-of-adventure-148","t":"Dodge Friendship of Adventure","n":"#148","c":"travel","th":"มิตรภาพที่พบเจอระหว่างการเดินทาง เรื่องราวจากผู้คนหลากหลายในมุมมองใหม่ๆ","en":"Friendships found on the road, and new perspectives from many different people.","r":1.0,"k":5},{"id":"hugs-hug-from-mom-149","t":"Hug from Mom","n":"#149","c":"hugs","th":"กอดแรกในชีวิต กอดที่บริสุทธิ์และพร้อมปกป้องจากทุกสิ่งที่มาทำร้ายในทุกเวลาที่ต้องการ","en":"The first hug of our life, pure and always ready to protect us from harm.","r":1.0,"k":5},{"id":"hugs-hug-from-me-150","t":"Hug from Me","n":"#150","c":"hugs","th":"กอดที่ทำให้เดินต่อไปได้ในวันที่ล้ม คือการกอดตัวเอง ประคองตัวเองให้ลุกขึ้นใช้ชีวิตต่อ","en":"The hug that gets us up on the days we fall is our own, holding ourselves up to keep living.","r":1.0,"k":5},{"id":"protect-the-weight-of-care-151","t":"The Weight of Care","n":"#151","c":"protect","th":"การปกป้องสิ่งที่รักอย่างทุ่มเท บางครั้งต้องชี้นำ บางครั้งต้องเลือกสิ่งที่ดี และเมื่อถึงเวลาก็ต้องปล่อยให้เรียนรู้เอง","en":"Protecting what we love with all we have: guiding sometimes, choosing what's good, and letting go to learn when the time is right.","r":1.0,"k":5},{"id":"protect-close-the-negative-sound-152","t":"Close the Negative Sound","n":"#152","c":"protect","th":"ปกป้องจากเสียงที่บั่นทอน และสนับสนุนด้วยเสียงที่ผลักดัน เสียงที่เติมไฟในวันที่มอดและเพิ่มกำลังใจในวันที่ท้อ","en":"Shutting out the voices that wear us down, and listening to those that refill our fire on tired days.","r":1.0,"k":5},{"id":"protect-protect-from-social-153","t":"Protect from Social","n":"#153","c":"protect","th":"พลังแห่งการปกป้องจากสื่อด้านลบที่อยู่รอบตัว","en":"The power to protect ourselves from the negative media around us.","r":1.0,"k":5},{"id":"protect-the-fragility-of-eggshells-154","t":"The Fragility of Eggshells","n":"#154","c":"protect","th":"สิ่งที่ปกป้องบางครั้งต้องสัมผัสอย่างทะนุถนอม เพราะบอบบางและแตกง่าย","en":"What protects us must sometimes be handled gently, because it is fragile and breaks easily.","r":1.0,"k":5},{"id":"animalsociety-accept-156","t":"Accept","n":"#156","c":"animalsociety","th":"การถูกเลือก ไม่ได้เกิดจากการยอมจำนน","en":"Being chosen is not the same as giving in.","r":1.0,"k":5},{"id":"firsttime-rainkeeper-158","t":"Rainkeeper","n":"#158","c":"firsttime","th":"แม้สายฝนจะพรากความอบอุ่นไป แต่ฉันยังยืนหยัดรักษาแสงเทียนเล็กๆ ไว้ ฉันคือร่มคันแรกที่เธอได้รับ คือเงาร่มของแม่ในวันที่พายุสังคมโหมกระหน่ำ","en":"Though the rain steals the warmth, I keep the small candle burning. I am the first umbrella you ever had, a mother's shelter in society's storm.","r":1.0,"k":5},{"id":"firsttime-guardian-roar-160","t":"Guardian Roar","n":"#160","c":"firsttime","th":"ในโลกใบใหญ่ที่เต็มไปด้วยอันตราย กรงเล็บรอบด้านเปรียบดั่งภัยที่จ้องคุกคาม การปกป้องอย่างสุดกำลังเพื่อไม่ให้เกิดอันตรายทั้งกายและใจ","en":"In a big, dangerous world, claws close in from every side. A roar of protection, guarding body and heart with everything it has.","r":1.0,"k":5},{"id":"firsttime-cosmic-embrace-161","t":"Cosmic Embrace","n":"#161","c":"firsttime","th":"ครั้งแรกที่ได้กอดลูกไว้ในอ้อมแขน ไม่ได้ให้แค่ความรัก แต่ให้ทั้งจักรวาลที่อบอุ่นที่สุดแก่เขา","en":"The first time I held my child, I gave not only love but the warmest universe I could.","r":1.0,"k":5},{"id":"rabbitdream-a-dreamer-s-embrace-162","t":"A Dreamer's Embrace","n":"#162","c":"rabbitdream","th":"จิตใจได้พักพิงเต็มที่ในโลกแห่งความฝัน ปล่อยวางความเครียดและความเจ็บปวด เพื่อกลับมาเผชิญความจริงในวันรุ่งขึ้นอย่างเข้มแข็ง","en":"The mind rests fully in the world of dreams, letting go of stress and pain, to face reality again tomorrow with strength.","r":1.0,"k":6},{"id":"rabbitdream-the-core-of-dream-s-light-163","t":"The Core of Dream's Light","n":"#163","c":"rabbitdream","th":"แม้โลกภายนอกจะมืดมิดเพียงใด เรายังมีโลกแห่งความฝันที่รอให้เข้าไปโอบกอดแสงสว่าง เป็นพลังให้ก้าวต่อไปในชีวิตจริง","en":"However dark the world outside, a dream world waits where we can hold the light and carry it back into real life.","r":1.0,"k":6},{"id":"goldzodiac-the-gold-capr ัง และผิดหวัง และยังไม่ท้อต่อการใช้ชีวิต","en":"Telling the one in the sky about life: the tiredness, the setbacks, the wins and the losses, and that we still haven't given up.","r":1.0,"k":6},{"id":"song-remember-the-people-in-the-sky-182","t":"Remember the People in the Sky","n":"#182","c":"song","th":"แม้สีสันของโลกจะเปลี่ยนไปมากแค่ไหน แต่การระลึกถึงใครคนหนึ่งจะยังคงอยู่ในความทรงจำตลอดไป","en":"However much the world's colours change, the memory of someone stays with us forever.","r":1.0,"k":6},{"id":"song-still-waiting-no-matter-how-long-183","t":"Still Waiting, No Matter How Long","n":"#183","c":"song","th":"ยังคงรออยู่เสมอ ความรู้สึกและความทรงจำเหมือนเดิมไม่เคยเปลี่ยน แม้จะจากกันไปนานและไกลแค่ไหน ก็ยังรอที่เดิม","en":"Still waiting. The feelings and memories never change. However long and far apart, I wait in the same place.","r":1.0,"k":6},{"id":"song-breath-in-the-balloon-184","t":"Breath in the Balloon","n":"#184","c":"song","th":"คนที่จากไปเหลือไว้เพียงลมหายใจที่บรรจุอยู่ในลูกโป่ง เป็นสิ่งเยียวยาใจในวันที่ท้อแท้และคิดถึง","en":"All that's left of the one who's gone is a breath inside a balloon, comfort for the days we miss them.","r":1.0,"k":6},{"id":"puppet-puppet-in-a-virtual-cage-185","t":"Puppet in a Virtual Cage","n":"#185","c":"puppet","th":"ตัวตนถูกจองจำและบงการโดยโลกโซเชียล จนกลายเป็นหุ่นเชิดที่ยอมแลกอิสระเพื่อยอดไลก์และการยอมรับที่จับต้องไม่ได้","en":"A self imprisoned and controlled by social media, a puppet trading freedom for likes and approval it can never hold.","r":0.712,"k":6},{"id":"puppet-puppet-on-expectations-strings-186","t":"Puppet on Expectations' Strings","n":"#186","c":"puppet","th":"ถูกประดับด้วยความสำเร็จ แต่เบื้องหลังถูกชักใยด้วยความคาดหวังของผู้อื่น จนสูญเสียตัวตนและแบกรับความเจ็บปวดจากการฝืน","en":"Decorated with success, yet pulled by others' expectations until the self is lost under the strain.","r":0.713,"k":6},{"id":"puppet-puppet-of-eternal-vanity-187","t":"Puppet of Eternal Vanity","n":"#187","c":"puppet","th":"ตัวตนที่ถูกจองจำในคราบผีเสื้อแสนสวย แท้จริงคือหุ่นเชิดที่ถูกชักใยด้วยใยแมงมุมแห่งบิวตี้ ต้องคอยเสริมแต่งและติดกับดักความงามที่ไม่มีวันสิ้นสุด","en":"Trapped in the costume of a beautiful butterfly, a puppet on the spider silk of beauty, forever adorning itself in an endless trap.","r":0.712,"k":6},{"id":"puppet-puppet-of-a-devoted-heart-188","t":"Puppet of a Devoted Heart","n":"#188","c":"puppet","th":"ตัวตนถูกครอบงำด้วยความหลงใหล ยอมให้ความรักชักจูงจนถลำลึกและลืมความเป็นตัวเอง เหมือนหุ่นเชิดที่มอบหัวใจเป็นเครื่องบูชาเพื่อรักษาความรักไว้","en":"Consumed by devotion, letting love pull us so deep we forget ourselves, a puppet offering its heart to keep that love.","r":0.713,"k":6},{"id":"facets-love-of-possession-189","t":"Love of Possession","n":"#189","c":"facets","th":"ความรักที่ต้องการเป็นเจ้าของ แม้มีอำนาจมากแค่ไหน แต่เมื่อไม่ถูกเลือก กรงทองที่ขังไว้ก็พังทลายและรักก็จากไปอยู่ดี","en":"Possessive love. However powerful, if you aren't chosen the golden cage collapses and love leaves anyway.","r":1.0,"k":6},{"id":"facets-love-and-loyalty-190","t":"Love and Loyalty","n":"#190","c":"facets","th":"ความรักที่ภักดีอย่างบริสุทธิ์ใจ ไม่เคยคิดร้ายต่อความรักและหน้าที่ที่ได้รับมอบหมาย","en":"A love of pure loyalty that never turns against love or duty.","r":1.0,"k":6},{"id":"facets-love-beyond-the-shell-191","t":"Love Beyond the Shell","n":"#191","c":"facets","th":"ความรักที่ไม่ได้มองเพียงภายนอกแล้วตัดสิน แต่เข้าใจตัวตนด้านใน และเปิดใจยอมรับสิ่งที่อยู่ภายใน","en":"A love that doesn't judge the outside, but understands and accepts what lives within.","r":1.0,"k":6},{"id":"facets-love-unbought-192","t":"Love Unbought","n":"#192","c":"facets","th":"ความรักเดียวที่ทุ่มทุกอย่างเพื่อให้ได้ครอบครอง โดยไม่สนใจสิ่งใด","en":"One love worth giving everything for, regardless of anything else.","r":1.0,"k":6},{"id":"healing-social-escape-healing-193","t":"Social Escape & Healing","n":"#193","c":"healing","th":"โลกสีสันจากโซเชียลที่ดึงเราออกจากพื้นที่ท็อกซิกของสังคม","en":"The colourful side of social media that pulls us out of society's toxic places.","r":1.0,"k":6},{"id":"healing-social-outside-194","t":"Social Outside","n":"#194","c":"healing","th":"ออกจากพื้นที่ที่ปิดกั้นไปสู่สิ่งใหม่ที่น่าค้นหา ยังมีอีกหลายสิ่งที่ยังไม่ได้สัมผัส","en":"Stepping out of a closed space toward new things to discover. So much is still waiting.","r":1.0,"k":6},{"id":"healing-social-motivation-195","t":"Social Motivation","n":"#195","c":"healing","th":"กำลังใจจากโซเชียลที่ช่วยให้ใจมีแรงฝ่าอุปสรรคในแต่ละวัน","en":"Encouragement from social media that gives the heart strength to face each day.","r":1.0,"k":6},{"id":"healing-social-comfort-196","t":"Social Comfort","n":"#196","c":"healing","th":"อ้อมกอดและคำปลอบใจจากโซเชียล ที่ช่วยให้วันที่ติดลบได้มีแรงใจบวกเข้ามา","en":"Hugs and comfort from social media that add something positive to our worst days.","r":1.0,"k":6},{"id":"literature-wiwaha-tang-laksana-a-union-of-opposites-197","t":"Wiwaha Tang Laksana (A Union of Opposites)","n":"#197","c":"literature","th":"การครองคู่ของสองชีวิตที่แตกต่าง ทว่าผูกพันกันด้วยการร่วมเป็นร่วมตายท่ามกลางภัยอันตรายที่ร่วมกัน","en":"Two very different lives joined as one, bound by facing every danger together.","r":1.416,"k":7},{"id":"literature-anantapatipak-endless-opposition-198","t":"Anantapatipak (Endless Opposition)","n":"#198","c":"literature","th":"สองขั้วที่ต่างกัน แต่ยังเอื้อต่อกันเป็นสิ่งที่ขาดกันไม่ได้","en":"Two opposite poles that still depend on each other and cannot exist apart.","r":1.397,"k":7},{"id":"brave20-candleheart-1-20","t":"Candleheart","n":"#1/20","c":"brave20","th":"กล้าที่จะสว่าง แม้ต้องเผาไหม้ตัวเองทีละน้อย กล้าแบกรับภาระ เพื่อเป็นแสงให้ตัวเองและผู้อื่น","en":"Brave enough to shine, even while slowly burning; carrying the weight to be a light for yourself and others.","r":1.0,"k":7},{"id":"brave20-brightmind-2-20","t":"Brightmind","n":"#2/20","c":"brave20","th":"กล้าที่จะคิดต่าง กล้าที่จะสว่างด้วยแสงของตัวเอง ไม่ต้องรอให้ใครมาเปิดสวิตช์ให้","en":"Brave enough to think differently and glow with your own light, without waiting for someone to flip the switch.","r":1.0,"k":7},{"id":"brave20-rainmarch-3-20","t":"Rainmarch","n":"#3/20","c":"brave20","th":"กล้าที่จะไปต่อ แม้มีพายุฝนขวางอยู่ข้างหน้าเหมือนอุปสรรค เพียงอย่าหยุดที่จะไป","en":"Brave enough to keep going through the storm ahead. Just don't stop.","r":1.0,"k":7},{"id":"brave20-resume-4-20","t":"ResuME","n":"#4/20","c":"brave20","th":"กล้าที่จะเดินหน้าไปหาความสำเร็จ แม้จะเจ็บและมีบาดแผลกี่ครั้ง อย่าท้อต่ออุปสรรค","en":"Brave enough to push toward success however many times you're hurt. Don't give up.","r":1.0,"k":7},{"id":"brave20-outframe-5-20","t":"Outframe","n":"#5/20","c":"brave20","th":"กล้าที่จะออกจากกรอบเดิมๆ ไปค้นหาสีสันจากนอกกรอบ","en":"Brave enough to leave the old frame and find colour outside it.","r":1.0,"k":7},{"id":"brave20-time-6-20","t":"Time","n":"#6/20","c":"brave20","th":"ทุกคนมีเวลาเท่ากัน เพียงกล้าที่จะใช้ให้คุ้มค่ามากกว่าปล่อยให้ผ่านไป","en":"Everyone has the same time. Be brave enough to use it well instead of letting it pass.","r":1.0,"k":7},{"id":"brave20-blazeflare-7-20","t":"Blazeflare","n":"#7/20","c":"brave20","th":"แม้มีเพียงไฟจากก้านไม้ขีดเล็กๆ ก็เพียงพอที่จะสร้างแสงสว่างให้ยิ่งใหญ่กว่าตัวมันได้","en":"Even the flame of a single matchstick can make a light far bigger than itself.","r":1.0,"k":7},{"id":"brave20-truewing-8-20","t":"Truewing","n":"#8/20","c":"brave20","th":"กล้าที่จะบินในแบบที่เราเป็น แม้ปีกของเราจะต่างจากใคร","en":"Brave enough to fly as yourself, even if your wings look different.","r":1.0,"k":7},{"id":"brave20-breakbowl-9-20","t":"Breakbowl","n":"#9/20","c":"brave20","th":"กล้าที่จะทุบโหลที่เขาเลี้ยงเราไว้ แล้วว่ายสู่ทะเลที่เราเลือกเอง","en":"Brave enough to break the bowl they kept you in and swim to the sea you choose.","r":1.0,"k":7},{"id":"brave20-start-up-frog-11-20","t":"Start-Up Frog","n":"#11/20","c":"brave20","th":"กล้าที่จะคิดนอกกรอบ ก้าวออกจากพื้นที่ปลอดภัย เพื่อเริ่มต้นเส้นทางแห่งการเติบโต","en":"Brave enough to think differently and leave the comfort zone to start growing.","r":1.0,"k":7},{"id":"brave20-braveface-12-20","t":"Braveface","n":"#12/20","c":"brave20","th":"แม้ชีวิตจะเต็มไปด้วยความทุกข์ ความเครียด และปัญหา แต่พร้อมกล้าที่จะยิ้ม สู้ และเดินหน้าต่อ","en":"Life is full of pain, stress and problems, yet you dare to smile, fight and keep going.","r":1.0,"k":7},{"id":"brave20-brave-to-stay-still-13-20","t":"Brave to Stay Still","n":"#13/20","c":"brave20","th":"ในวันที่โลกสาดใส่เราด้วยเสียงลบ ความคาดหวัง และคำพูดบั่นทอน ความกล้าไม่ใช่แค่การต่อต้าน แต่คือการนิ่งอยู่กับตัวเองโดยไม่ถูกกลืนกิน","en":"When the world throws negativity and pressure at you, courage isn't only fighting back. It's staying still within yourself without being swallowed.","r":1.0,"k":7},{"id":"brave20-meltheart-14-20","t":"Meltheart","n":"#14/20","c":"brave20","th":"หัวใจที่ไม่หวั่นต่อความหนาวเหน็บ ยอมค่อยๆ ละลายเพื่อประคองแสงเล็กๆ ให้เดินทางต่อ แม้ไม่มีใครเห็นการเสียสละนั้น","en":"A heart unafraid of the cold, melting slowly to keep a small light going, even if no one sees the sacrifice.","r":1.0,"k":7},{"id":"brave20-riskheart-15-20","t":"Riskheart","n":"#15/20","c":"brave20","th":"ในเกมของชีวิต ไม่มีใครรู้ไพ่ในมือโชคชะตา ผู้กล้าคือคนที่ยอมวางเดิมพัน บางครั้งต้องเสี่ยงจึงจะได้ก้าว","en":"In the game of life no one knows fate's hand. The brave place their bet; sometimes you must risk it to move forward.","r":1.0,"k":7},{"id":"brave20-guiding-light-of-the-heart-16-20","t":"Guiding Light of the Heart","n":"#16/20","c":"brave20","th":"การเดินทางที่อาศัยเพียงแสงแห่งความหวังอันน้อยนิดส่องนำทางในความมืด แต่หัวใจเต็มไปด้วยความกล้าหาญและความมุ่งมั่น","en":"A journey lit only by a small light of hope in the dark, carried by a heart full of courage and resolve.","r":1.0,"k":7},{"id":"brave20-standforth-17-20","t":"Standforth","n":"#17/20","c":"brave20","th":"กล้าที่จะก้าวออกไปในยามที่คนอื่นถอย ไม่รอให้ใครมอบตำแหน่งฮีโร่ แค่กล้าพอ ก็เป็นฮีโร่ของใครบางคนได้","en":"Brave enough to step forward when others step back. You don't need a title; being brave is enough to be someone's hero.","r":1.0,"k":7},{"id":"brave20-mendheart-18-20","t":"Mendheart","n":"#18/20","c":"brave20","th":"กล้าเผชิญกับบาดแผลทางใจ และเลือกที่จะเย็บมันเอง ไม่รอให้ใครมาเยียวยา พร้อมก้าวต่อไปจนวันหนึ่งแผลจะสมานเอง","en":"Brave enough to face the wounds of the heart and stitch them yourself, moving on until one day they heal.","r":1.0,"k":7},{"id":"brave20-nextlight-19-20","t":"Nextlight","n":"#19/20","c":"brave20","th":"กล้าที่จะเปิดประตูออกจากปราสาทที่ขังตัวเองไว้ เพื่อไปพบแสงใหม่ในโลกกว้าง","en":"Brave enough to open the castle door that held you and meet a new light in the wide world.","r":1.0,"k":7},{"id":"brave40-moonlight-courage-21-40","t":"Moonlight Courage","n":"#21/40","c":"brave40","th":"กล้าที่จะเป็นแสงเล็กๆ บนเส้นทางที่มืดมิด เพื่อให้ใครสักคนยังมองเห็นความหวัง","en":"Brave enough to be a small light on a dark path, so someone can still see hope.","r":1.0,"k":7},{"id":"brave40-blossomheart-22-40","t":"Blossomheart","n":"#22/40","c":"brave40","th":"กล้าที่จะเบ่งบานและแบ่งปันความสุขให้กับคนรอบตัว","en":"Brave enough to bloom and share happiness with those around you.","r":1.0,"k":7},{"id":"brave40-free-as-the-foam-23-40","t":"Free as the Foam","n":"#23/40","c":"brave40","th":"กล้าที่จะใช้ชีวิตอย่างอิสระ สนุกสนาน และยอมรับความไม่แน่นอน เหมือนฟองที่ลอยไปตามสายลม","en":"Brave enough to live freely and joyfully, accepting uncertainty like foam drifting on the wind.","r":1.0,"k":7},{"id":"brave40-fearfriend-24-40","t":"Fearfriend","n":"#24/40","c":"brave40","th":"กล้าที่จะอยู่ร่วมกับสิ่งที่คนอื่นหวาดกลัว เลือกเรียนรู้และเข้าใจ เพื่อพบว่าภายใต้ความน่ากลัวอาจมีความงามซ่อนอยู่","en":"Brave enough to live alongside what others fear, choosing to understand it and finding the beauty hidden underneath.","r":1.0,"k":7},{"id":"brave40-brave-mortality-25-40","t":"Brave Mortality","n":"#25/40","c":"brave40","th":"กล้าใช้ชีวิตด้วยหัวใจที่ยอมรับวันสุดท้ายของเส้นทาง และเลือกใช้ชีวิตอย่างเต็มที่โดยไม่หวั่นกลัวต่อการสิ้นสุด","en":"Brave enough to accept the last day of the road and live fully, unafraid of the end.","r":1.0,"k":7},{"id":"brave40-brave-gaze-26-40","t":"Brave Gaze","n":"#26/40","c":"brave40","th":"กล้าที่จะมองและเผชิญกับความจริงทั้งดีและร้าย และไม่ปล่อยให้สิ่งใดผ่านตาไปโดยไม่ลงมือทำ","en":"Brave enough to look at the truth, good or bad, and never let it pass without acting.","r":1.0,"k":7},{"id":"brave40-brave-silence-27-40","t":"Brave Silence","n":"#27/40","c":"brave40","th":"ความกล้าที่จะสื่อสารด้วยความเงียบ รับฟัง และแสดงออกเพียงภาษากาย เพราะบางสถานการณ์ยิ่งพูดยิ่งพัง","en":"The courage to communicate through silence, to listen and speak with the body, because sometimes words only break things.","r":1.0,"k":7},{"id":"brave40-brave-choice-28-40","t":"Brave Choice","n":"#28/40","c":"brave40","th":"ชีวิตที่กล้าเลือกเส้นทางของตนเอง ไม่ยอมให้ใครชักใย ไม่ว่าถูกหรือผิด ก็เป็นเส้นทางที่สร้างด้วยหัวใจตัวเอง","en":"A life brave enough to choose its own path. Right or wrong, it is built by your own heart, not pulled by others.","r":1.0,"k":7},{"id":"brave40-brave-beyond-29-40","t":"Brave Beyond","n":"#29/40","c":"brave40","th":"ความกล้าไม่ใช่เพียงการเผชิญ แต่คือการเปิดใจอยู่ร่วมกับสิ่งที่เกินจินตนาการโดยไม่หวาดหวั่น","en":"Courage isn't only facing things; it's opening your heart to what lies beyond imagination, without fear.","r":1.0,"k":7},{"id":"brave40-brave-balance-30-40","t":"Brave Balance","n":"#30/40","c":"brave40","th":"ความกล้าไม่ใช่การเลือกเพียงด้านใด แต่คือการยืนหยัดในความจริงว่าชีวิตมีทั้งขาวและดำ ดีและร้าย สุขและทุกข์","en":"Courage isn't picking one side, but standing in the truth that life is black and white, good and bad, joy and sorrow.","r":1.0,"k":7},{"id":"brave40-brave-dreamer-31-40","t":"Brave Dreamer","n":"#31/40","c":"brave40","th":"กล้าที่จะสร้างภาพฝันของชีวิต แม้ยังไม่เป็นจริงหรือถูกมองว่าเพ้อฝัน แต่ยังเลือกเชื่อในพลังของความฝัน","en":"Brave enough to build a dream of life, even if it isn't real yet and others call it foolish, and still believe in it.","r":1.0,"k":7},{"id":"brave40-brave-receiver-32-40","t":"Brave Receiver","n":"#32/40","c":"brave40","th":"กล้าที่จะยอมรับและเปิดใจต่อความรักในทุกรูปแบบ เพราะรักคือบทเรียนที่มีทั้งสุขและทุกข์ และหัวใจที่กล้าจะไม่กลัวที่จะรักอีกครั้ง","en":"Brave enough to accept love in every form. Love teaches through joy and pain, and a brave heart isn't afraid to love again.","r":1.0,"k":7},{"id":"brave40-brave-investment-33-40","t":"Brave Investment","n":"#33/40","c":"brave40","th":"ชีวิตคือการลงทุน กล้าที่จะเสี่ยงเดิมพันอย่างรอบคอบ ความสำเร็จมักรออยู่เสมอ","en":"Life is an investment. Dare to take careful risks; success is waiting.","r":1.0,"k":7},{"id":"brave40-brave-leader-34-40","t":"Brave Leader","n":"#34/40","c":"brave40","th":"กล้าที่จะก้าวขึ้นเป็นผู้นำในเวลาที่ไม่มีใครกล้า แม้ยังไม่พร้อม แต่หัวใจยืนอยู่ข้างหน้าด้วยความรับผิดชอบ","en":"Brave enough to lead when no one else will. Not ready yet, but the heart stands in front with responsibility.","r":1.0,"k":7},{"id":"brave40-brave-empty-35-40","t":"Brave Empty","n":"#35/40","c":"brave40","th":"กล้าที่จะเปิดรับทุกสิ่ง ไม่ทำตัวเป็นน้ำเต็มแก้ว เพราะโลกนี้ยังมีอีกมากให้เรียนรู้","en":"Brave enough to stay open and never be a full cup. There is still so much to learn.","r":1.0,"k":7},{"id":"brave40-permanent-delete-36-40","t":"Permanent Delete","n":"#36/40","c":"brave40","th":"กล้าที่จะลบอดีตอย่างถาวร ไม่ใช่เพื่อหนีความเจ็บปวด แต่เพราะรู้ว่าการเก็บไฟล์อดีตไว้ในใจ จะเหลือพื้นที่น้อยเกินไปสำหรับความสุขใหม่ๆ","en":"Brave enough to delete the past for good, not to escape pain, but because old files leave too little room for new happiness.","r":1.0,"k":7},{"id":"brave40-brave-wings-37-40","t":"Brave Wings","n":"#37/40","c":"brave40","th":"การบินที่ไม่ต้องมีใครมอบปีกให้ เพราะสร้างขึ้นเองแม้ไม่สมบูรณ์ ทุกรอยแผลคือร่องรอยของความพยายาม ทุกความล้มเหลวคือแรงผลักให้บินสูงขึ้น","en":"Flying on wings no one gave you, built yourself however imperfect. Every scar is effort; every fall pushes you higher.","r":1.0,"k":7},{"id":"brave40-brave-compass-38-40","t":"Brave Compass","n":"#38/40","c":"brave40","th":"กล้าที่จะเดินทางต่อแม้เส้นทางเต็มไปด้วยหนามและอุปสรรค ด้วยเข็มทิศแห่งชีวิตที่ชี้ทางให้ไม่หลง ไม่หยุด และไม่ถอย","en":"Brave enough to keep travelling through thorns, guided by a compass that won't let you get lost, stop or turn back.","r":1.0,"k":7},{"id":"brave40-brave-jadebreaker-39-40","t":"Brave Jadebreaker","n":"#39/40","c":"brave40","th":"กล้าที่จะทุบรูปลักษณ์ที่สังคมยกย่องให้มูลค่า เพื่อเผยตัวตนที่ซ่อนอยู่ เพราะคุณค่าไม่ได้อยู่ที่สิ่งที่โลกนิยามว่างดงาม แต่คือการกล้าเปิดเผยและยอมรับตัวเอง","en":"Brave enough to break the image society prizes and reveal the self within. Worth isn't what the world calls beautiful; it's daring to be seen.","r":1.0,"k":7},{"id":"energy-calm-energy-1-8","t":"Calm Energy","n":"#1/8","c":"energy","th":"พลังสงบที่สยบความวุ่นวาย ต้องมีช่วงเวลาปรับจูนความคิด ไม่วิ่งตามกระแสสังคม ความสงบทำให้เราพร้อมรับมือกับทุกสิ่ง","en":"A calm energy that quiets chaos. Take time to tune your thoughts instead of chasing every trend; calm prepares us for anything.","r":1.0,"k":7},{"id":"energy-energy-of-someone-2-8","t":"Energy of Someone","n":"#2/8","c":"energy","th":"พลังที่ใช้หมดไปกับสังคมในแต่ละวัน ขอเพียงมีสักคนเข้ามาเติมเต็ม ก็เพียงพอที่จะเริ่มใหม่ในวันพรุ่งนี้","en":"Energy spent on the world each day. Just one person to refill it is enough to begin again tomorrow.","r":1.0,"k":7},{"id":"energy-energy-of-creativity-3-8","t":"Energy of Creativity","n":"#3/8","c":"energy","th":"เริ่มต้นทุกวันด้วยความคิดและทักษะ ไม่มีอะไรง่ายดาย ต้องพัฒนาตลอดเวลา","en":"Start every day with ideas and skill. Nothing is easy; keep improving.","r":1.0,"k":7},{"id":"energy-energy-of-protection-4-8","t":"Energy of Protection","n":"#4/8","c":"energy","th":"ปกป้องต้นกล้าของหัวใจจากพายุทรายที่โหมกระหน่ำ บางครั้งจิตใจก็ไม่แข็งแรงพอจะฝ่าพายุแห่งความวุ่นวายของสังคม","en":"Protecting the heart's seedling from the sandstorm. Sometimes the mind isn't strong enough to cross society's storm alone.","r":1.0,"k":7},{"id":"energy-energy-of-success-5-8","t":"Energy of Success","n":"#5/8","c":"energy","th":"ตั้งเป้าหมายชีวิตและคิดเสมอว่าเราคือราชสีห์ที่ไม่ถอยต่ออุปสรรค ความสำเร็จรออยู่ที่เส้นชัยเสมอ","en":"Set your goals and remember you are a lion who never backs down. Success waits at the finish line.","r":1.0,"k":7},{"id":"energy-energy-of-balance-6-8","t":"Energy of Balance","n":"#6/8","c":"energy","th":"รัก โลภ โกรธ หลง มีอยู่ในทุกคนมากน้อยต่างกัน เพียงบริหารและรักษาสมดุลของอารมณ์ทั้งสี่ ก็จะเกิดประโยชน์กับตนเอง","en":"Love, greed, anger and delusion live in all of us. Balance the four and they work for you.","r":1.0,"k":7},{"id":"energy-energy-of-moving-forward-7-8","t":"Energy of Moving Forward","n":"#7/8","c":"energy","th":"ก้าวต่อไปโดยไม่ถอยหลัง แม้บางวันขาไร้เรี่ยวแรงหรือเส้นทางขรุขระ แต่ขออย่าหยุดก้าว","en":"Keep stepping forward. Some days your legs are weak and the road is rough, but don't stop.","r":1.0,"k":7},{"id":"energy-energy-of-safety-8-8","t":"Energy of Safety","n":"#8/8","c":"energy","th":"ความปลอดภัยในการใช้ชีวิตในสังคม สร้างเกราะที่พร้อมรับสิ่งอันตรายต่อกายและใจ เพื่อดำเนินชีวิตต่อไป","en":"Safety in society: building armour against what harms body and mind so life can go on.","r":1.0,"k":7},{"id":"love2-a-love-that-lets-go-1-8","t":"A Love That Lets Go","n":"#1/8","c":"love2","th":"ความรักคือการรู้ว่าเมื่อไหร่ควรปล่อยสิ่งที่ใจไม่อาจเหนี่ยวรั้งไว้ได้อีกต่อไป","en":"Love is knowing when to release what you can no longer hold.","r":1.0,"k":8},{"id":"love2-love-of-my-own-choice-2-8","t":"Love of My Own Choice","n":"#2/8","c":"love2","th":"ความรักที่เลือกหยิบเอง แม้ไม่รู้ว่าผลจะเป็นอย่างไร","en":"Love chosen by my own hand, regardless of the outcome.","r":1.0,"k":8},{"id":"love2-love-painted-in-my-colors-3-8","t":"Love Painted in My Colors","n":"#3/8","c":"love2","th":"ความรักที่สวยงามที่สุด ไม่ใช่ความรักที่สมบูรณ์แบบที่สุด แต่คือความรักที่เราลงมือระบายสีด้วยตัวเอง","en":"The most beautiful love isn't the most perfect one, but the love we paint with our own colours.","r":1.0,"k":8},{"id":"love2-love-in-a-devil-s-mask-4-8","t":"Love in a Devil's Mask","n":"#4/8","c":"love2","th":"ทางเดียวที่จะหยุดความเจ็บปวดจากรักได้ คือการยอมร้ายเพื่อตัดใจและทำลายรักที่ล้มเหลว","en":"The only way to end the pain of love is to be the villain: cut ties and destroy a failing love.","r":1.0,"k":8},{"id":"love2-the-matching-key-5-8","t":"The Matching Key","n":"#5/8","c":"love2","th":"ต้องมีรักสักครั้งที่เข้ากันได้ หาให้เจอกุญแจที่เหมาะกับตัวเรา","en":"There must be a love, at least once, that truly fits. Keep searching for the key made for you.","r":1.0,"k":8},{"id":"love2-the-cupid-s-own-heart-6-8","t":"The Cupid's Own Heart","n":"#6/8","c":"love2","th":"บางครั้งเป็นผู้ให้และมอบความรักมาตลอด ก็สมควรได้รับรักที่สมบูรณ์สักครั้ง","en":"After always giving love, one deserves to receive a complete love for once.","r":1.0,"k":8},{"id":"love2-choosing-with-the-heart-7-8","t":"Choosing with the Heart","n":"#7/8","c":"love2","th":"เรื่องของหัวใจ ต้องใช้ใจเลือก จนกว่าจะเจอสิ่งที่ใช่","en":"When it comes to the heart, use your heart to choose until you find the right one.","r":1.0,"k":8},{"id":"love2-a-heart-with-love-to-protect-8-8","t":"A Heart with Love to Protect","n":"#8/8","c":"love2","th":"ความรักที่ช่วยปกป้องหัวใจจากขวากหนามที่เข้ามา","en":"Love that protects the heart from the thorns that come in.","r":1.0,"k":8},{"id":"outerinner-outer-malice-inner-grace-1-8","t":"Outer Malice, Inner Grace","n":"#1/8","c":"outerinner","th":"ภายนอกอาจดูร้าย แต่ภายในยังคงหวังดีและพร้อมช่วยเหลือเสมอ","en":"It may look cruel outside, but inside it means well and is always ready to help.","r":1.0,"k":8},{"id":"outerinner-outer-king-inner-joker-2-8","t":"Outer King, Inner Joker","n":"#2/8","c":"outerinner","th":"มีความเป็นราชาในสายตาคนอื่น แต่ภายในอาจซ่อนโจ๊กเกอร์ไว้","en":"A king in others' eyes, perhaps hiding a joker within.","r":1.0,"k":8},{"id":"outerinner-outer-achromatic-inner-chromatic-3-8","t":"Outer Achromatic, Inner Chromatic","n":"#3/8","c":"outerinner",
